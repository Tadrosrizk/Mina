const APP_PUBLIC_URL = 'https://hilarious-youtiao-3ba75b.netlify.app/';
function appBaseUrl(){
  // QR links must be real public links. Opened from a file / content:// / the Android app (localhost) the
  // current address is useless (and very long), so fall back to the published site.
  try{
    if(/^https?:$/.test(location.protocol) && !/^(localhost|127\.|0\.0\.0\.0)/.test(location.hostname)) return location.origin + location.pathname;
  }catch(e){}
  return APP_PUBLIC_URL;
}
function makeQr(el, text, size, dark, light){
  // Uses the embedded qrcode-generator (supports every QR version, so long links still fit).
  el.innerHTML = '';
  try{
    const qr = qrcode(0, 'L'); qr.addData(String(text)); qr.make();
    const n = qr.getModuleCount(), quiet = 2, scale = Math.max(2, Math.ceil(size*2 / (n + quiet*2)));
    const px = (n + quiet*2) * scale;
    const cv = document.createElement('canvas'); cv.width = px; cv.height = px;
    cv.style.width = size + 'px'; cv.style.height = size + 'px'; cv.style.imageRendering = 'pixelated';
    const g = cv.getContext('2d');
    g.fillStyle = light || '#FFFFFF'; g.fillRect(0, 0, px, px);
    g.fillStyle = dark || '#000000';
    for(let r = 0; r < n; r++) for(let c = 0; c < n; c++) if(qr.isDark(r, c)) g.fillRect((c+quiet)*scale, (r+quiet)*scale, scale, scale);
    el.appendChild(cv);
    return true;
  }catch(e){
    el.innerHTML = '<div style="color:#b00;font-size:12px;padding:8px;">تعذر إنشاء الكود: ' + escapeHtml(String(e && e.message || e)) + '</div>';
    return false;
  }
}

/* ---------------- Photos on Supabase Storage (free tier, bucket "student-photos") ----------------
   A photo is uploaded as a small JPEG under an unguessable name and only its URL is kept in the
   data. If Storage isn't set up yet (or there's no connection) the photo is kept inline on the
   device exactly like before, so nothing ever fails because of this. */
const PHOTO_BUCKET = 'student-photos';
let photoStorageDownUntil = 0;
function randomHex(bytes){
  const a = new Uint8Array(bytes); crypto.getRandomValues(a);
  return [...a].map(x => x.toString(16).padStart(2,'0')).join('');
}
async function dataUrlToBlob(dataUrl){ return await (await fetch(dataUrl)).blob(); }
// Hook: the secure mode asks the server for a short-lived upload ticket here. Open mode needs none.
async function preparePhotoUpload(classId, path){
  if(!secureMode || adminSession) return true;
  if(!teacherCtx) return false;
  const r = await sbRpc('t_photo_ticket', { p_class:classId, p_secret:teacherCtx.secret, p_path:path });
  return !!r.ok;
}
async function uploadPhotoDataUrl(classId, dataUrl){
  if(!supabaseClient || !supabaseClient.storage || Date.now() < photoStorageDownUntil) return null;
  try{
    const path = classId + '/' + randomHex(16) + '.jpg';
    if(!(await preparePhotoUpload(classId, path))) return null;
    const blob = await dataUrlToBlob(dataUrl);
    const { error } = await Promise.race([
      supabaseClient.storage.from(PHOTO_BUCKET).upload(path, blob, { contentType:'image/jpeg', cacheControl:'31536000', upsert:false }),
      new Promise(r => setTimeout(() => r({ error:{ message:'timeout' } }), 20000))
    ]);
    if(error){ console.warn('photo upload failed:', error.message || error); photoStorageDownUntil = Date.now() + 60000; return null; }
    return supabaseClient.storage.from(PHOTO_BUCKET).getPublicUrl(path).data.publicUrl;
  }catch(e){
    console.warn('photo upload exception:', e && e.message);
    photoStorageDownUntil = Date.now() + 60000;
    return null;
  }
}
// Moves photos that are still stored inline (older data) into Storage. Admin tool.
async function migratePhotosToStorage(){
  const note = document.getElementById('photoMigNote');
  if(!window.__ctx || window.__ctx.k !== 'admin'){ alert('هذه العملية للمسؤول فقط'); return; }
  photoStorageDownUntil = 0;
  let moved = 0, failed = 0;
  for(const c of classes){
    for(const s of c.students){
      if(s.photo && s.photo.startsWith('data:')){
        if(note) note.textContent = 'جارِ نقل الصور... ' + moved;
        const url = await uploadPhotoDataUrl(c.id, s.photo);
        if(url){ s.photo = url; moved++; } else { failed++; if(Date.now() < photoStorageDownUntil) break; }
      }
    }
  }
  if(moved) await saveClasses();
  if(note){
    note.style.color = failed ? 'var(--bad)' : 'var(--good)';
    note.textContent = failed
      ? ('تم نقل ' + moved + ' صورة، وفشل ' + failed + '. تأكد إنك شغّلت ملف SQL الخاص بالصور في Supabase')
      : ('تم نقل ' + moved + ' صورة ✓');
  }
}

async function handleProfilePhoto(event, classId, studentId){
  if(denyIfNotAllowed(classId)) return;
  const input = event.target, file = input.files[0];
  if(!file) return;
  const note = document.getElementById('profileSaveNote');
  if(!/^image\/(jpeg|png|webp)$/.test(file.type)){ alert('نوع الملف غير مدعوم. اختار صورة JPG أو PNG أو WEBP'); input.value=''; return; }
  if(file.size > 8*1024*1024){ alert('حجم الصورة كبير (أقصى حد 8 ميجا)'); input.value=''; return; }
  if(note) note.textContent = 'جارِ رفع الصورة...';
  try{
    const dataUrl = await resizeImageFile(file);
    const c = classes.find(x=>x.id===classId);
    const student = c.students.find(s=>s.id===studentId);
    const url = await uploadPhotoDataUrl(classId, dataUrl);
    student.photo = url || dataUrl;
    await saveClasses();
    const av = document.getElementById('profileAvatar');
    if(av){
      av.innerHTML = `<img src="${student.photo}" alt="">`;
      av.style.cursor = 'zoom-in';
      av.onclick = () => openPhotoPreviewFor(classId, studentId);
    }
    if(note) note.textContent = url ? 'تم حفظ الصورة ✓' : 'تم حفظ الصورة على الجهاز ✓';
  }catch(e){
    console.error('photo resize failed', e);
    if(note) note.textContent = '';
    alert('تعذر قراءة الصورة');
  }
  input.value = '';
}

  if(!src) return;
  const bg = document.createElement('div');
  bg.className = 'modal-bg photo-preview';
  bg.style.cssText = 'background:rgba(0,0,0,.88);z-index:200;';
  bg.innerHTML = `
    <button class="pp-close" aria-label="${t('close')}" style="position:fixed;top:14px;inset-inline-end:14px;width:44px;height:44px;border-radius:50%;border:none;background:rgba(255,255,255,.18);color:#fff;font-size:22px;cursor:pointer;">✕</button>
    <div class="pp-load" style="color:#fff;font-size:14px;">${'جارِ التحميل'}...</div>
    <img alt="" style="display:none;max-width:94vw;max-height:86vh;object-fit:contain;border-radius:10px;touch-action:pinch-zoom;">`;
  const img = bg.querySelector('img'), load = bg.querySelector('.pp-load');
  img.onload = () => { load.style.display='none'; img.style.display='block'; };
  img.onerror = () => { load.textContent = 'تعذر تحميل الصورة'; };
  img.src = src;
  const close = () => { document.removeEventListener('keydown', onKey); bg.remove(); };
  const onKey = e => { if(e.key === 'Escape') close(); };
  document.addEventListener('keydown', onKey);
  bg.addEventListener('click', e => { if(e.target !== img) close(); });
  document.body.appendChild(bg);
}

async function saveStudentProfile(classId, studentId){
  if(denyIfNotAllowed(classId)) return;
  const c = classes.find(x=>x.id===classId);
  const student = c.students.find(s=>s.id===studentId);
  const name = document.getElementById('pf_name').value.trim();
  const note0 = document.getElementById('profileSaveNote');
  const bad = m => { if(note0){ note0.style.color = 'var(--bad)'; note0.textContent = m; } return true; };
  if(!name) return bad('اكتب اسم المخدوم');
  const gender = document.getElementById('pf_gender').value;
  const dob = document.getElementById('pf_dob').value;
  if(genderOf(student) && gender !== genderOf(student) && gender === '') return bad('اختار النوع (ولد أو بنت)');
  if(dob){ const de = dobError(dob); if(de) return bad(de); }
  else if(student.birthDate) return bad('اكتب تاريخ الميلاد');
  if(note0) note0.style.color = 'var(--good)';
  student.name = name;
  student.gender = gender;
  student.birthDate = dob;
  student.mobile = document.getElementById('pf_mobile').value.trim();
  student.confessionFather = document.getElementById('pf_confession').value.trim();
  await saveClasses();
  const note = document.getElementById('profileSaveNote');
  note.textContent = 'اتحفظت ✓';
  refreshAges();
  if(document.getElementById('studentRows')) await renderStudentRows(classId);
}

async function renderTeacherFromQr(classId, key){
  if(secureMode){
    if(!key){ app.innerHTML = `${churchBanner()}<div class="card empty">الكود غير مرتبط بفصل موجود. جرّب كارت QR صحيح.</div><a class="backlink" href="javascript:void(0)" onclick="renderLogin()">${t('back_to_login')}</a>`; return; }
    app.innerHTML = `<div class="empty">جارِ التحميل...</div>`;
    const c0 = await enterTeacher(classId, key);
    if(!c0){ app.innerHTML = `${churchBanner()}<div class="card empty">الكود غير مرتبط بفصل موجود. جرّب كارت QR صحيح.</div><a class="backlink" href="javascript:void(0)" onclick="renderLogin()">${t('back_to_login')}</a>`; return; }
    renderTeacherDashboard(c0);
    return;
  }
  const c = classes.find(x=>x.id===classId);
  if(!c){
    app.innerHTML = `${churchBanner()}<div class="card empty">الفصل ده مش موجود أو اتحذف.</div>`;
    return;
  }
  if(c.active === false && !adminUnlocked){
    app.innerHTML = `${churchBanner()}<div class="card empty">الفصل ده معطّل. كلّم المسؤول</div><a class="backlink" href="javascript:void(0)" onclick="renderLogin()">${t('back_to_login')}</a>`;
    return;
  }
  renderTeacherDashboard(c);
}

function applyLoginBg(){
  let img = '';
  try{ img = localStorage.getItem('login-bg-data') || ''; }catch(e){}
  const el = document.getElementById('loginBg'); if(!el) return;
  if(img) el.style.setProperty('--login-img', `url("${img}")`);
  else el.style.setProperty('--login-img', `url("${DEFAULT_LOGIN_BG}")`);   // built-in church photo; the user can replace it from Settings
}
function pickLoginBg(){
  const inp = document.createElement('input'); inp.type = 'file'; inp.accept = 'image/jpeg,image/png,image/webp';
  inp.onchange = () => {
    const f = inp.files && inp.files[0]; if(!f) return;
    if(!/^image\//.test(f.type)){ alert('اختار صورة JPG أو PNG أو WEBP'); return; }
    const img = new Image(), url = URL.createObjectURL(f);
    img.onload = () => {
      const k = Math.min(1, 1280 / Math.max(img.width, img.height));
      const cv = document.createElement('canvas'); cv.width = Math.round(img.width*k); cv.height = Math.round(img.height*k);
      cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
      URL.revokeObjectURL(url);
      try{ localStorage.setItem('login-bg-data', cv.toDataURL('image/jpeg', 0.8)); }
      catch(e){ alert('تعذر حفظ الصورة على الجهاز (المساحة ممتلئة).'); return; }
      applyLoginBg();
    };
    img.onerror = () => { URL.revokeObjectURL(url); alert('تعذر قراءة الصورة'); };
    img.src = url;
  };
  inp.click();
}
function clearLoginBg(){ try{ localStorage.removeItem('login-bg-data'); }catch(e){} applyLoginBg(); }

/* ---------------- QR CAMERA SCANNER ---------------- */

let qrScanner = null;
let qrScanLocked = false;

function getQrKeyFromText(decodedText){
  try{ return new URL(decodedText, location.href).searchParams.get('k') || ''; }catch(e){ return ''; }
}
function getClassIdFromQrText(decodedText){
  try{
    const url = new URL(decodedText, location.href);
    const teacher = url.searchParams.get('teacher');
    if(teacher) return teacher;
  }catch(e){}
  if(secureMode) return null;

  // Also accept a plain class id in case a QR was generated manually.
  const direct = String(decodedText || '').trim();
  const match = classes.find(c => c.id === direct);
  return match ? match.id : null;
}

function openQrScanner(){
  qrScanLocked = false;

  const bg = document.createElement('div');
  bg.className = 'modal-bg';
  bg.id = 'qrScannerModal';
  bg.innerHTML = `
    <div class="modal" style="max-width:430px;padding:18px;">
      <div style="font-weight:900;font-size:18px;">مسح كارت الـQR</div>
      <div style="font-size:12px;color:#7B8194;margin-top:4px;">
        وجّه الكاميرا ناحية كود الـQR الخاص بالخادم
      </div>

      <div class="scanner-wrap">
        <div id="qr-reader"></div>
      </div>

      <div id="qrScannerStatus" class="scanner-status">جارِ تشغيل الكاميرا...</div>

      <button class="btn btn-line" style="width:100%;margin-top:10px;" onclick="closeQrScanner()">
        إغلاق الكاميرا
      </button>
    </div>
  `;
  document.body.appendChild(bg);

  setTimeout(startQrScanner, 100);
}

async function startQrScanner(){
  const status = document.getElementById('qrScannerStatus');

  if(typeof Html5Qrcode === 'undefined'){
    if(status) status.textContent = 'مكتبة مسح QR لم يتم تحميلها. تأكد من اتصال الإنترنت.';
    return;
  }

  try{
    qrScanner = new Html5Qrcode("qr-reader");

    const config = {
      fps: 10,
      qrbox: { width: 240, height: 240 },
      aspectRatio: 1.0
    };

    await qrScanner.start(
      { facingMode: "environment" },
      config,
      onQrScanSuccess,
      (errorMessage) => {
        // Ignore normal "QR not found" frames.
      }
    );

    if(status) status.textContent = 'وجّه الكاميرا إلى كود الـQR';
  }catch(err){
    console.error('QR camera error:', err);
    if(status){
      status.innerHTML =
        'مش قادر يفتح الكاميرا. اسمح للموقع باستخدام الكاميرا، وتأكد إن الصفحة تعمل على HTTPS.';
    }
  }
}

async function onQrScanSuccess(decodedText){
  if(qrScanLocked) return;
  qrScanLocked = true;

  const classId = getClassIdFromQrText(decodedText);

  if(!classId){
    qrScanLocked = false;
    const status = document.getElementById('qrScannerStatus');
    if(status) status.textContent = 'الكود غير مرتبط بفصل موجود. جرّب كارت QR صحيح.';
    return;
  }

  const c = secureMode ? null : classes.find(x => x.id === classId);

  try{
    if(qrScanner){
      await qrScanner.stop();
      await qrScanner.clear();
    }
  }catch(e){}

  const modal = document.getElementById('qrScannerModal');
  if(modal) modal.remove();

  // Enter the teacher's data directly after successful scan.
  if(secureMode){ renderTeacherFromQr(classId, getQrKeyFromText(decodedText)); return; }
  renderTeacherDashboard(c);
}

async function closeQrScanner(){
  try{
    if(qrScanner){
      await qrScanner.stop();
      await qrScanner.clear();
    }
  }catch(e){}

  qrScanner = null;
  qrScanLocked = false;

  const modal = document.getElementById('qrScannerModal');
  if(modal) modal.remove();
}

async function attemptLogin(){
  const u = document.getElementById('loginUser').value.trim();
  const p = document.getElementById('loginPass').value;
  const err = document.getElementById('loginError');
  if(!u || !p){ err.textContent = 'اكتب اسم المستخدم وكلمة السر'; return; }
  err.textContent = '';
  await classesReadyPromise;
  if(secureMode){
    const hash = await sha256Hex(p);
    const r = await sbRpc('teacher_login', { p_username:u, p_pass_hash:hash });
    if(!r.ok){ err.textContent = r.network ? 'محتاج اتصال بالنت عشان تدخل' : (r.error === 'inactive' ? 'الفصل ده معطّل. كلّم المسؤول' : 'بيانات الدخول غير صحيحة'); return; }
    const c = await enterTeacher(r.class_id, hash);
    if(!c){ err.textContent = 'بيانات الدخول غير صحيحة'; return; }
    renderTeacherDashboard(c);
    return;
  }
  const hash = await sha256Hex(p);
  let cls = null, inactive = false;
  for(const cl of classes){
    for(const sv of (cl.servants || [])){
      if((sv.username || '').toLowerCase() === u.toLowerCase() && sv.passwordHash === hash){
        if(cl.active === false) inactive = true; else cls = cl;
      }
    }
  }
  if(!cls && inactive){ err.textContent = 'الفصل ده معطّل. كلّم المسؤول'; return; }
  if(!cls){ err.textContent = 'بيانات الدخول غير صحيحة'; return; }
  renderTeacherDashboard(cls);
}

// Sets (or cancels, if the same status is tapped again) one student's
// attendance for the given date, saving immediately with no separate
// "save" step, and offers a one-tap undo of the last change.
// Sets (or cancels, if the same status is tapped again) one student's
// attendance for the given date, saving immediately with no separate
// "save" step, and offers a one-tap undo of the last change.
// `refreshScreen` re-renders whichever screen called this (teacher
// dashboard or the admin's manage-students screen) after an undo.
const markBusy = new Set();
async function markAttendance(classId, date, studentId, status, refreshScreen){
  if(denyIfNotAllowed(classId)) return;
  const busyKey = classId + '|' + date + '|' + studentId;
  if(markBusy.has(busyKey)) return;           // ignore repeated taps while this one is being saved
  markBusy.add(busyKey);
  const c = classes.find(x=>x.id===classId);
  if(!refreshScreen) refreshScreen = () => renderTeacherDashboard(c, date);
  const row = document.querySelector(`.att-row[data-student="${studentId}"], .student-row[data-student="${studentId}"]`);
  try{
    const attendance = await loadAttendanceCached(classId);
    const rec = attendance[date] || {};
    const prevRaw = rec[studentId];
    const prevMark = normalizeMark(prevRaw);

    let newMark;
    if(prevMark && prevMark.status === status){ delete rec[studentId]; newMark = undefined; }   // tapping the active status again cancels it
    else{ newMark = { status, time: nowTimeStr() }; rec[studentId] = newMark; }
    attendance[date] = rec;

    // The write to this device happens synchronously inside saveAttendance; the cloud copy follows in the
    // background. Success feedback is only given once the device copy is verified.
    const savePromise = saveAttendance(classId, attendance);
    let persisted = false;
    try{ persisted = localStorage.getItem(lkey('attendance-'+classId)) === JSON.stringify(attendance); }catch(e){}
    savePromise.catch(err => console.error('Save failed:', err));
    if(!persisted){
      // roll back the in-memory change and tell the user
      if(prevMark){ rec[studentId] = prevRaw; } else { delete rec[studentId]; }
      invalidateAttendanceCache(classId);
      alert('تعذر حفظ التسجيل على الجهاز (التخزين ممتلئ؟). لم يتم تسجيل الحضور.');
      return;
    }

    if(row){
      row.querySelectorAll('.toggle button').forEach(b=>b.classList.remove('on','burst'));
      if(newMark){
        const activeBtn = row.querySelector('.' + STATUS_META[status].cls);
        if(activeBtn){ activeBtn.classList.add('on'); if(status==='present'){ void activeBtn.offsetWidth; activeBtn.classList.add('burst'); } }
      }
      const timeEl = row.querySelector('.mark-time');
      if(timeEl) timeEl.textContent = newMark && newMark.time ? 'وقت التسجيل: ' + newMark.time : '';
    }
    if(newMark && status==='present') presentFeedback(); else if(newMark && status==='absent') absentFeedback(); else hapticTick();
    renderStats(c, attendance);

    const studentName = escapeHtml((c.students.find(x=>x.id===studentId)||{}).name || '');
    const msg = newMark ? `تم تسجيل "${STATUS_META[status].label}" لـ${studentName}` : `تم إلغاء التسجيل لـ${studentName}`;
    showUndoToast(msg, async () => {
      const attendance2 = await loadAttendanceCached(classId);
      const rec2 = attendance2[date] || {};
      if(prevMark){ rec2[studentId] = prevRaw; } else { delete rec2[studentId]; }
      attendance2[date] = rec2;
      invalidateAttendanceCache(classId);
      await saveAttendance(classId, attendance2);
      refreshScreen();
    });
  } finally {
    setTimeout(() => markBusy.delete(busyKey), 250);
  }
}

let undoToastTimer = null;
function showUndoToast(message, onUndo){
  let toast = document.getElementById('undoToast');
  if(!toast){
    toast = document.createElement('div');
    toast.id = 'undoToast';
    toast.className = 'undo-toast';
    document.body.appendChild(toast);
  }
  toast.innerHTML = `<span>${message}</span><button id="undoToastBtn">تراجع</button>`;
  document.getElementById('undoToastBtn').onclick = () => {
    clearTimeout(undoToastTimer);
    toast.classList.remove('show');
    onUndo();
  };
  requestAnimationFrame(() => toast.classList.add('show'));
  clearTimeout(undoToastTimer);
  undoToastTimer = setTimeout(() => { toast.classList.remove('show'); }, 4000);
}

function renderStats(c, attendance){
  const box = document.getElementById('statsList');
  if(!box) return;
  if(c.students.length===0){ box.innerHTML = `<div class="empty">مفيش طلاب.</div>`; return; }
  box.innerHTML = c.students.map(s=>{
    const st = calcStats(attendance, s.id);
    const streak = currentAbsenceStreak(attendance, s.id);
    const pctLabel = st.pct===null ? 'لا يوجد بيانات بعد' : st.pct+'٪ حضور';
    const barColor = st.pct===null ? '#2A3F6E' : (st.pct>=85?'var(--good)': st.pct>=60?'var(--late)':'var(--bad)');
    const breakdown = st.total
      ? `حاضر ${st.present} · غايب ${st.absent}`
      : '';
    const alert = streak >= 3
      ? `<span class="stat-tag" style="background:var(--bad-soft);color:var(--bad);margin-inline-start:6px;">⚠ غايب ${streak} مرات متتالية</span>`
      : '';
    return `
    <div style="margin-bottom:14px;">
      <div style="display:flex;justify-content:space-between;align-items:center;">
        <span class="att-name" style="cursor:pointer;" onclick="openStudentProfile('${c.id}','${s.id}')">${escapeHtml(s.name)}${alert}</span>
        <span class="att-pct">${pctLabel}</span>
      </div>
      <div class="bar-bg"><div class="bar-fill" style="width:${st.pct||0}%;background:${barColor}"></div></div>
      ${breakdown ? `<div class="stat-breakdown">${breakdown}</div>` : ''}
    </div>`;
  }).join('');
}

// Global tap feedback: any button/icon/chip anywhere in the app gets a
// brief blue glow + shake + light haptic buzz on tap, without having to

/* ---------------- navigation history + Back (screen stack) ---------------- */
const NAV_SCREENS = ['renderLogin','renderForgotPassword','renderAdminEmailRecovery','renderAdminLogin','renderAdminSetup','renderAdminRecovery','renderNewPasswordForm','renderAdmin','renderTeacherDashboard','renderTeacherFromQr','openClassDashboard','manageStudents','openStudentProfile','openServantDashboard'];
const NAV_LOGINISH = new Set(['renderLogin','renderForgotPassword','renderAdminEmailRecovery','renderAdminLogin','renderAdminSetup','renderAdminRecovery','renderNewPasswordForm']);
const NAV_ROOTS = new Set(['renderAdmin','renderTeacherDashboard','renderTeacherFromQr']);
let navStack = [], navBusy = false, lastBackPress = 0;
function navKey(name, a){ const x = a[0]; return name + ':' + (x && typeof x === 'object' ? x.id : x); }
function navReflect(){
  const top = navStack[navStack.length-1];
  const loginish = !top || NAV_LOGINISH.has(top.name);
  showChurch = loginish;
  document.body.classList.toggle('on-login', !!top && (top.name === 'renderLogin' || top.name === 'renderForgotPassword'));
  document.body.classList.toggle('has-back', navStack.length > 1 && !(top && top.name === 'renderLogin'));
}

function injectCtxNav(name, args){
  if(document.querySelector('nav.bottom-nav')) return;
  const a0 = args[0];
  const classId = a0 && typeof a0 === 'object' ? a0.id : a0;
  if(name === 'openClassComparison' && !adminUnlocked) return;
  if(name !== 'openClassComparison' && !classId) return;
  const host = document.getElementById('app') || document.body;
  host.insertAdjacentHTML('beforeend', ctxNavHtml(classId, name === 'openClassDashboard' && !adminUnlocked ? 'class' : (adminUnlocked ? '' : '')));
}
function installNav(){
  CTX_NAV_SCREENS.forEach(name => {
    const orig = window[name]; if(typeof orig !== 'function') return;
    window[name] = function(...a){
      const res = orig.apply(this, a);
      Promise.resolve(res).then(() => { try{ injectCtxNav(name, a); }catch(e){} });
      return res;
    };
  });
  NAV_SCREENS.forEach(name => {
    const orig = window[name]; if(typeof orig !== 'function') return;
    window[name] = function(...a){
      if(!navBusy){
        if(name === 'renderLogin') navStack = [];
        else if(NAV_ROOTS.has(name) && navStack.length && NAV_LOGINISH.has(navStack[navStack.length-1].name)) navStack = [];
        const entry = { name, a: a.map(x => x && typeof x === 'object' && x.id && classes.includes(x) ? { __cid:x.id } : x), key: navKey(name, a) };
        const top = navStack[navStack.length-1];
        if(top && top.key === entry.key) navStack[navStack.length-1] = entry; else navStack.push(entry);
        if(navStack.length > 30) navStack.shift();
      }
      navReflect();
      return orig.apply(this, a);
    };
  });
}
function appGoBack(){ return appHandleBack(); }
// Returns true when the press was used for in-app navigation (so the native app must NOT exit).
function appHandleBack(){
  const modals = document.querySelectorAll('.modal-bg');
  if(modals.length){ const m = modals[modals.length-1]; if(m.id === 'qrScannerModal') closeQrScanner(); else m.remove(); return true; }
  if(document.getElementById('qrScannerModal')){ closeQrScanner(); return true; }
  if(navStack.length > 1){
    navStack.pop();
    const e = navStack[navStack.length-1];
    const args = e.a.map(x => x && x.__cid ? classes.find(c => c.id === x.__cid) : x);
    if(args.some((x, i) => e.a[i] && e.a[i].__cid && !x)){ renderLogin(); return true; }
    navBusy = true;
    try{ window[e.name](...args); } finally { navBusy = false; }
    navReflect();
    return true;
  }
  // at a root screen: ask for a second press before leaving the app
  const now = Date.now();
  if(now - lastBackPress < 2000){ lastBackPress = 0; return false; }
  lastBackPress = now;
  showUndoToast && toastInfo('اضغط رجوع مرة تانية للخروج');
  return true;
}
function toastInfo(msg){
  let el = document.getElementById('infoToast');
  if(!el){ el = document.createElement('div'); el.id = 'infoToast'; el.style.cssText = 'position:fixed;left:50%;transform:translateX(-50%);bottom:96px;background:#1F3358;color:#fff;padding:10px 16px;border-radius:99px;font-size:13px;z-index:80;box-shadow:0 6px 18px rgba(0,0,0,.3);'; document.body.appendChild(el); }
  el.textContent = msg; el.style.display = 'block';
  clearTimeout(el._t); el._t = setTimeout(() => { el.style.display = 'none'; }, 1800);
}
window.appHandleBack = appHandleBack;
installNav();
// browser/system back (web + PWA): keep one dummy history entry so Back is handled in-app
try{
  history.replaceState({ app:1 }, '');
  history.pushState({ app:2 }, '');
  window.addEventListener('popstate', () => {
    const used = appHandleBack();
    if(used) history.pushState({ app:2 }, '');
    else history.back();
  });
}catch(e){}
// on-screen keyboard: hide the bottom nav while typing so it never sits on top of the field
document.addEventListener('focusin', e => { if(e.target && /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) && e.target.type !== 'checkbox') document.body.classList.add('kb-open'); });
document.addEventListener('focusout', () => { setTimeout(() => { const a = document.activeElement; if(!a || !/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)) document.body.classList.remove('kb-open'); }, 80); });

(async function init(){
  applyLangDirection();
  initTheme();
  if(!IS_NATIVE_APP){
    setupManifestAndIcons();
    registerServiceWorker();
  }

  // Kick the data load off in the background instead of blocking the first
  // paint on a network round trip — this is what made the login screen feel
  // slow once Supabase was in the loop. classesReadyPromise is awaited by
  // whatever actually needs `classes` populated (submitting login, admin).
  classesReadyPromise = detectSecureMode().then(() => loadClasses());
  classesReadyPromise.then(() => { flushPending(); pingSupabaseKeepAlive(); });
  updateSyncBadge();

  const checkinParam = params.get('checkin');
  if(checkinParam && checkinParam.includes(':')){
    app.innerHTML = `<div class="empty">جارِ التحميل...</div>`;
    await classesReadyPromise;
    const [ciClass, ciStudent] = checkinParam.split(':');
    renderSelfCheckin(ciClass, ciStudent, params.get('t'));
  }else if(teacherParam){
    app.innerHTML = `<div class="empty">جارِ التحميل...</div>`;
    await classesReadyPromise;
    renderTeacherFromQr(teacherParam, params.get('k'));
  }else if(params.get('admin')){
    goToAdmin();
  }else{
    let resume = null;
    try{ resume = JSON.parse(sessionStorage.getItem('__resume') || 'null'); sessionStorage.removeItem('__resume'); }catch(e){}
    if(resume && resume.k === 'admin'){
      await classesReadyPromise;
      adminUnlocked = true;
      renderAdmin();
    }else if(resume && resume.k === 'teacher'){
      await classesReadyPromise;
      const rc = classes.find(x => x.id === resume.id);
      if(rc) renderTeacherDashboard(rc); else renderLogin();
    }else{
      renderLogin();
    }
  }
})();
</script>
