<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>سجل الحضور</title>
<meta name="theme-color" content="#1F3358">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="حضور الأحد">
<link rel="icon" id="appIconLink">
<link rel="apple-touch-icon" id="appleIconLink">
<link rel="manifest" id="manifestLink">

<meta name="theme-color" content="#1F3358">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="سجل الحضور">

<link rel="stylesheet" href="fonts/tajawal.css">
<script src="libs/qrcode.min.js"></script>
<script src="libs/html5-qrcode.min.js"></script>
<script src="libs/chart.umd.js"></script>
<script src="libs/xlsx.full.min.js"></script>
<style>
  :root{
    --paper:#F8F6F0;
    --ink:#1E2638;
    --board:#1F3358;
    --board-2:#2A4373;
    --chalk:#F1EFE8;
    --accent:#E3A23B;
    --accent-soft:#F1D8A8;
    --good:#4C7A5B;
    --good-soft:#DCE9DF;
    --bad:#C1553C;
    --bad-soft:#F3DFD7;
    --late:#C98A2E;
    --late-soft:#F1E0BE;
    --excused:#5E6E96;
    --excused-soft:#DFE3EE;
    --line:#D5D8E2;
  }
  html[data-theme="dark"]{
    --paper:#151B2B; --ink:#E8EAF1; --board:#0E1830; --board-2:#16223D;
    --chalk:#F1EFE8; --line:#3A4560;
  }
  html[data-theme="dark"] body{background:var(--paper);}
  html[data-theme="dark"] .card{background:#1A2236;border-color:var(--line);color:var(--ink);}
  html[data-theme="dark"] input, html[data-theme="dark"] textarea, html[data-theme="dark"] select{
    background:#1A2236;color:var(--ink);border-color:var(--line);
  }
  html[data-theme="dark"] .toggle button{background:#1A2236;color:#9AA0B2;}
  html[data-theme="dark"] .empty{color:#9AA0B2;}
  html[data-theme="dark"] .link-box{background:#1A2236;color:#9AA0B2;}
  html[data-theme="dark"] .modal{background:#1A2236;color:var(--ink);}
  .theme-toggle{
    position:fixed;top:14px;left:14px;z-index:60;background:rgba(255,255,255,.85);
    border:1px solid var(--line);border-radius:99px;width:38px;height:38px;
    display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:16px;
    box-shadow:0 2px 8px rgba(0,0,0,.1);
  }
  html[data-theme="dark"] .theme-toggle{background:rgba(26,34,54,.9);}
  .settings-toggle{
    position:fixed;top:62px;left:14px;z-index:60;background:rgba(255,255,255,.85);
    border:1px solid var(--line);border-radius:99px;width:38px;height:38px;
    display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:16px;
    box-shadow:0 2px 8px rgba(0,0,0,.1);
  }
  html[data-theme="dark"] .settings-toggle{background:rgba(26,34,54,.9);}
  .install-toggle{
    position:fixed;top:14px;right:14px;z-index:60;background:var(--accent);color:#2b1c05;
    border:none;border-radius:99px;padding:9px 14px;font-family:inherit;font-weight:700;font-size:12.5px;
    cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.15);display:none;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:
      radial-gradient(1200px 500px at 50% -120px, rgba(31,51,88,.10), transparent 60%),
      var(--paper);
    color:var(--ink);
    font-family:'Tajawal',sans-serif;
    min-height:100vh;
  }
  .wrap{max-width:760px;margin:0 auto;padding:28px 18px 60px;}
  header{
    display:flex;align-items:center;gap:14px;margin-bottom:26px;
  }
  .logo{
    width:46px;height:46px;border-radius:10px;background:var(--board);
    display:flex;align-items:center;justify-content:center;color:var(--chalk);
    font-weight:900;font-size:20px;flex-shrink:0;
  }
  h1{font-size:22px;font-weight:900;margin:0;}
  .sub{color:#5B6275;font-size:13px;margin-top:2px;}

  .card{
    background:#fff;border:1px solid var(--line);border-radius:16px;
    padding:20px;margin-bottom:16px;
    box-shadow:0 2px 10px rgba(31,51,88,.05);
  }
  .board-card{
    background:linear-gradient(160deg, var(--board) 0%, var(--board-2) 100%);color:var(--chalk);border-radius:16px;
    padding:18px 20px;margin-bottom:14px;position:relative;overflow:hidden;
    box-shadow:0 4px 14px rgba(31,51,88,.15);
  }
  .board-card::after{
    content:"";position:absolute;inset:0;
    background:repeating-linear-gradient(180deg,transparent,transparent 27px,rgba(255,255,255,.035) 28px);
    pointer-events:none;
  }
  .board-title{font-weight:900;font-size:18px;}
  .board-sub{font-size:13px;opacity:.8;margin-top:2px;}
  .board-row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;}
  /* class card: info on top, buttons in an even grid underneath so nothing overlaps */
  .board-card .board-row{display:block;}
  .board-actions{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;width:100%;margin-top:14px;}
  .board-actions .btn{width:100%;min-width:0;padding:10px 4px;font-size:13px;line-height:1.3;white-space:normal;text-align:center;margin:0;}
  .pill{
    background:rgba(241,239,232,.12);border:1px solid rgba(241,239,232,.3);
    padding:4px 10px;border-radius:99px;font-size:12px;
  }
  .btn{
    border:none;border-radius:10px;padding:10px 16px;font-family:inherit;
    font-weight:700;font-size:14px;cursor:pointer;transition:.15s;
  }
  .btn-accent{background:var(--accent);color:#2b1c05;}
  .btn-accent:hover{filter:brightness(1.06);}
  .btn-ghost{background:transparent;color:var(--chalk);border:1px solid rgba(241,239,232,.4);}
  .btn-ghost:hover{background:rgba(241,239,232,.1);}
  .btn-line{background:transparent;border:1px solid var(--line);color:var(--ink);}
  .btn-line:hover{background:#F0F1F6;}
  .btn-danger{background:transparent;color:var(--bad);border:1px solid var(--bad);}

  input, .studentline input{
    font-family:inherit;border:1px solid var(--line);border-radius:9px;
    padding:9px 12px;font-size:14px;width:100%;background:#fff;color:var(--ink);
    transition:border-color .15s ease, box-shadow .15s ease;
  }
  input:focus{
    outline:none;border-color:var(--accent);
    box-shadow:0 0 0 3px rgba(227,162,59,.18);
  }
  label{font-size:12px;color:#5B6275;font-weight:700;display:block;margin-bottom:4px;}
  .field{margin-bottom:12px;}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}

  .student-row{
    display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px dashed var(--line);
  }
  .student-row:last-child{border-bottom:none;}
  .student-row input{flex:1;}
  .x-btn{background:none;border:none;color:var(--bad);cursor:pointer;font-size:16px;padding:2px 6px;}
  .student-clickable{transition:opacity .15s ease;}
  .student-clickable:hover{opacity:.75;}

  .empty{
    text-align:center;color:#7B8194;padding:30px 10px;font-size:14px;
  }

  .modal-bg{
    position:fixed;inset:0;background:rgba(30,38,56,.55);
    display:flex;align-items:center;justify-content:center;z-index:50;padding:16px;
  }
  .modal{
    background:#fff;border-radius:18px;padding:24px;max-width:360px;width:100%;
    text-align:center;
  }
  .qrbox{
    background:var(--paper);border:2px dashed var(--accent);border-radius:14px;
    padding:16px;display:inline-block;margin:14px 0;
  }
  .link-box{
    background:#F0F1F6;border-radius:9px;padding:8px 10px;font-size:11px;
    word-break:break-all;color:#5B6275;margin-top:6px;
  }

  /* teacher view */
  .att-list{margin-top:10px;}
  .att-row{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:12px 4px;border-bottom:1px solid var(--line);
  }
  .att-row:last-child{border-bottom:none;}
  .att-name{font-weight:700;font-size:15px;}
  .att-pct{font-size:12px;color:#7B8194;}
  .toggle{
    display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;
    width:100%;flex-shrink:0;
  }
  .toggle button{
    flex:1;padding:10px 0;border:none;border-left:1px solid var(--line);
    background:#fff;font-family:inherit;font-weight:700;font-size:12.5px;cursor:pointer;color:#7B8194;
    white-space:nowrap;
  }
  .toggle button:last-child{border-left:none;}
  .toggle button.present.on{background:var(--good);color:#fff;}
  .toggle button.late.on{background:var(--late);color:#fff;}
  .toggle button.absent.on{background:var(--bad);color:#fff;}
  .toggle button.excused.on{background:var(--excused);color:#fff;}

  .mark-time{font-size:10.5px;color:#7B8194;text-align:center;margin-top:2px;height:13px;}

  .undo-toast{
    position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(12px);
    background:var(--board);color:var(--chalk);border-radius:12px;padding:10px 14px;
    display:flex;align-items:center;gap:12px;font-size:13px;box-shadow:0 6px 18px rgba(0,0,0,.25);
    z-index:90;opacity:0;transition:opacity .2s ease, transform .2s ease;max-width:92vw;
  }
  .undo-toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  .undo-toast button{
    background:var(--accent);color:#2b1c05;border:none;border-radius:8px;
    padding:6px 12px;font-family:inherit;font-weight:700;font-size:12.5px;cursor:pointer;flex-shrink:0;
  }
  .stat-breakdown{font-size:11px;color:#7B8194;margin-top:2px;}
  .reminder-banner{
    position:fixed;top:14px;left:50%;transform:translateX(-50%);
    background:var(--board);color:var(--chalk);border-radius:12px;padding:12px 16px;
    z-index:95;box-shadow:0 6px 18px rgba(0,0,0,.25);max-width:92vw;font-size:13px;
  }
  .reminder-banner .rb-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:6px;}
  .reminder-banner button{background:var(--accent);color:#2b1c05;border:none;border-radius:8px;padding:5px 10px;font-family:inherit;font-weight:700;font-size:12px;cursor:pointer;}
  .reminder-banner .rb-close{background:transparent;color:var(--chalk);opacity:.7;font-size:14px;}

  .avatar{
    width:40px;height:40px;border-radius:10px;flex-shrink:0;
    background:var(--board);color:var(--chalk);display:flex;align-items:center;justify-content:center;
    font-weight:900;font-size:15px;overflow:hidden;
  }
  .avatar img{width:100%;height:100%;object-fit:cover;}

  .bar-bg{background:#E6E8F0;border-radius:99px;height:6px;width:100%;margin-top:4px;overflow:hidden;}
  .bar-fill{height:100%;background:var(--good);border-radius:99px;}

  .save-note{font-size:12px;color:var(--good);text-align:center;margin-top:10px;height:16px;}
  .backlink{display:block;text-align:center;font-size:12px;color:#7B8194;margin-top:22px;}
  .stat-tag{
    font-size:11px;background:var(--accent-soft);color:#6a4a0c;padding:2px 8px;border-radius:99px;
  }

  .church-banner{
    text-align:center;padding:26px 16px 20px;margin:-28px -18px 24px;
    background:linear-gradient(180deg, var(--board) 0%, var(--board-2) 100%);
    border-radius:0 0 22px 22px;
    box-shadow:0 6px 18px rgba(31,51,88,.18);
  }
  .church-cross{
    width:38px;height:38px;line-height:38px;border-radius:50%;
    background:rgba(241,239,232,.14);border:1.5px solid var(--accent);
    color:var(--accent);font-size:18px;margin:0 auto 10px;
  }
  .church-name{
    font-weight:900;font-size:15px;color:var(--chalk);line-height:1.6;
    max-width:320px;margin:0 auto;
  }
  .church-service{
    font-size:12px;color:var(--accent);font-weight:700;margin-top:6px;
    letter-spacing:.4px;
  }

  .church-banner, header{ animation:riseIn .45s ease both; }
  header{ animation-delay:.03s; }
  .card, .board-card{ animation:riseIn .4s ease both; animation-delay:.08s; }
  @keyframes riseIn{
    from{ opacity:0; transform:translateY(8px); }
    to{ opacity:1; transform:translateY(0); }
  }

  .btn{ transform:translateY(0); transition:transform .12s ease, filter .12s ease, box-shadow .12s ease; }
  .btn:active{ transform:scale(.96); }
  .btn-accent:hover{ box-shadow:0 4px 14px rgba(227,162,59,.35); }

  /* Global press feedback: a soft blue glow + tiny shake on ANY tappable
     control (buttons, toggle chips, floating icons). Triggered by JS
     adding/removing .tap-fx so it works consistently across all of them,
     not just .btn. */
  .tap-fx{ animation: tapShake .26s ease; }
  .tap-fx, button, .btn, .toggle button, .theme-toggle, .install-toggle,
  .settings-toggle, .x-btn, .rb-close{
    box-shadow: 0 0 0 0 rgba(59,130,246,0);
    transition: transform .12s ease, box-shadow .18s ease, filter .12s ease;
  }
  .tap-fx{
    box-shadow: 0 0 0 5px rgba(59,130,246,.32) !important;
    filter: brightness(1.04);
  }
  @keyframes tapShake{
    0%{ transform:scale(.93) rotate(0deg); }
    28%{ transform:scale(.93) rotate(-3deg); }
    58%{ transform:scale(.96) rotate(3deg); }
    100%{ transform:scale(1) rotate(0deg); }
  }

  .toggle button{ transition:background .18s ease, color .18s ease, border-color .18s ease, transform .1s ease; }
  .toggle button:active{ transform:scale(.94); }
  .toggle button.on{ animation:pop .25s ease; }
  .toggle button.present.burst{ animation:presentBurst .45s cubic-bezier(.2,.9,.3,1.3); }
  @keyframes presentBurst{ 0%{ transform:scale(.88); box-shadow:0 0 0 0 rgba(46,160,90,.55); } 55%{ transform:scale(1.07); box-shadow:0 0 0 14px rgba(46,160,90,0); } 100%{ transform:scale(1); box-shadow:0 0 0 0 rgba(46,160,90,0); } }
  .toggle button{ min-height:44px; font-size:14px; }
  @media (prefers-reduced-motion:reduce){ .toggle button.present.burst, .toggle button.on{ animation:none; } }
  @keyframes pop{
    0%{ transform:scale(.9); }
    60%{ transform:scale(1.05); }
    100%{ transform:scale(1); }
  }

  .board-card{ transition:transform .15s ease, box-shadow .15s ease; }
  .board-card:hover{ transform:translateY(-2px); box-shadow:0 8px 20px rgba(31,51,88,.18); }

  .bar-fill{ transition:width .6s ease; }

  .church-cross{ animation:glow 2.4s ease-in-out infinite; }
  @keyframes glow{
    0%,100%{ opacity:.75; }
    50%{ opacity:1; }
  }

  .modal-bg{ animation:fadeBg .2s ease; }
  @keyframes fadeBg{ from{opacity:0;} to{opacity:1;} }
  .modal{ animation:modalIn .25s cubic-bezier(.2,.8,.3,1.2); }
  @keyframes modalIn{
    from{ opacity:0; transform:scale(.92) translateY(6px); }
    to{ opacity:1; transform:scale(1) translateY(0); }
  }

  .save-note{ transition:opacity .3s ease; }

  .scanner-wrap{
    background:#111;border-radius:16px;padding:10px;margin:14px 0;overflow:hidden;
  }
  #qr-reader{width:100%;min-height:240px;}
  #qr-reader video{border-radius:10px!important;max-height:360px;object-fit:cover;}
  .scanner-status{font-size:12px;color:#7B8194;text-align:center;margin-top:8px;min-height:18px;}
  .scan-btn{
    width:100%;display:flex;align-items:center;justify-content:center;gap:8px;
    font-size:15px;padding:13px 16px;
  }


  /* ===================== v2: modern mobile-app look ===================== */
  :root{
    --radius:20px;
    --bg:#F3F4F8;
    --shadow:0 1px 2px rgba(31,51,88,.05), 0 8px 24px rgba(31,51,88,.08);
  }
  body{ background:var(--bg); -webkit-tap-highlight-color:transparent; }
  .wrap{ max-width:600px; padding:0 16px 40px; }
  body:has(.bottom-nav) .wrap{ padding-bottom:112px; }
  body:has(.bottom-nav) .undo-toast{ bottom:96px; }

  /* slim app bar instead of the big banner */
  .church-banner{
    position:sticky; top:0; z-index:40;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    min-height:88px; margin:0 -16px 18px; padding:10px 14px 10px 58px;
    border-radius:0 0 24px 24px;
    box-shadow:0 8px 22px rgba(31,51,88,.22);
    text-align:center;
  }
  .church-cross{ display:none; }
  .church-name{ font-size:clamp(15px,4.6vw,19px); font-weight:900; line-height:1.45; max-width:none; margin:0; letter-spacing:0; }
  .church-service{ font-size:12px; margin-top:4px; letter-spacing:0; }
  .church-service::before{ content:"\271E  "; }
  .church-banner, header{ animation:none; }
  .reminder-banner{ top:80px; }
  /* two-column form rows become one column on phones; stat tiles (row2 outside a card) stay 2x2 */
  @media (max-width:480px){
    .card > .row2{ grid-template-columns:1fr; gap:0; }
    .card > .row2 > input, .card > .row2 > .btn{ margin-bottom:10px; }
  }
  .row2 + .card{ margin-top:14px; }
  .sync-badge{
    position:fixed; top:98px; left:50%; transform:translateX(-50%); z-index:44;
    padding:7px 14px; border-radius:99px; font-size:12px; font-weight:700; cursor:pointer;
    box-shadow:0 6px 18px rgba(0,0,0,.2); max-width:92vw; white-space:nowrap;
  }
  .sync-badge.pending{ background:var(--accent); color:#2b1c05; }
  .sync-badge.done{ background:var(--good); color:#fff; }

  .fbar{ display:grid; grid-template-columns:1.2fr 1fr 1fr; gap:6px; margin:8px 0; }
  .fbar select, .fbar input{ padding:8px; font-size:13px; min-width:0; }
  .gstats{ display:grid; grid-template-columns:repeat(auto-fit,minmax(92px,1fr)); gap:8px; }
  .gcell{ background:var(--bg,#F3F4F8); border-radius:12px; padding:10px 8px; text-align:center; min-width:0; }
  html[data-theme="dark"] .gcell{ background:#222B42; }
  .gcell .gl{ font-size:11.5px; color:#7B8194; }
  .gcell .gn{ font-size:21px; font-weight:900; line-height:1.3; }
  .gcell .gs{ font-size:11.5px; color:#7B8194; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .stu-note{ font-size:11.5px; color:#7B8194; margin-top:6px; }
  .agegroups{ display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
  .agchip{ font-size:12px; background:var(--accent-soft,#FBF1DC); border-radius:99px; padding:4px 10px; }
  .stu-meta{ font-size:11.5px; color:#7B8194; margin-top:1px; }
  .gbadge.male{ color:#2E5E8C; } .gbadge.female{ color:#B0507A; }
  .age-preview{ font-size:12.5px; margin:-4px 0 10px; min-height:16px; }
  .class-tools{ display:grid; grid-template-columns:1.4fr 1fr 1fr; gap:6px; margin-bottom:10px; }
  .class-tools select, .class-tools input{ padding:8px; font-size:13px; min-width:0; }
  .badge-off{ background:#E6E8F0; color:#5B6275; border-radius:99px; padding:2px 8px; font-size:11px; margin-inline-start:6px; }
  .board-card.inactive{ opacity:.65; }
  .servant-row{ display:grid; grid-template-columns:1fr 1fr 1fr auto; gap:6px; margin-bottom:8px; align-items:center; }
  .servant-row input{ padding:8px; font-size:13px; min-width:0; }
  @media (max-width:480px){ .servant-row{ grid-template-columns:1fr 1fr; } .servant-row .x-btn{ justify-self:end; } .class-tools{ grid-template-columns:1fr 1fr; } .class-tools input{ grid-column:1 / -1; } }
  .settings-toggle{ display:none; }
  body.logged-in .settings-toggle{ display:flex; }
  .theme-toggle, .settings-toggle{
    top:13px; width:40px; height:40px; font-size:17px;
    background:rgba(255,255,255,.14); border:1px solid rgba(255,255,255,.22);
    box-shadow:none; -webkit-backdrop-filter:blur(6px); backdrop-filter:blur(6px);
  }
  .theme-toggle{ left:max(10px, calc(50% - 290px)); }
  .settings-toggle{ left:max(10px, calc(50% - 290px)); }
  html[data-theme="dark"] .theme-toggle, html[data-theme="dark"] .settings-toggle{
    background:rgba(255,255,255,.14);
  }

  header{ margin-bottom:16px; gap:12px; }
  .logo{ width:46px; height:46px; border-radius:15px; font-size:14px; letter-spacing:.5px;
         background:linear-gradient(160deg,var(--board),var(--board-2)); box-shadow:0 6px 14px rgba(31,51,88,.25); }
  h1{ font-size:20px; }

  .card{ border:none; border-radius:var(--radius); padding:18px; margin-bottom:14px; box-shadow:var(--shadow); }
  .card > label:first-child{ font-size:15px; font-weight:900; color:var(--ink); margin-bottom:12px; }
  .board-card{ border-radius:22px; padding:18px; box-shadow:0 12px 28px rgba(31,51,88,.22); margin-bottom:14px; }
  .board-card::after{ display:none; }
  .board-card:hover{ transform:none; box-shadow:0 12px 28px rgba(31,51,88,.22); }
  .board-title{ font-size:17px; }

<script>
const app = document.getElementById('app');

/* ---------------- NATIVE (Capacitor) BRIDGE ----------------
   Only active inside the installed Android app. In a normal browser every
   helper below falls back to the original web behaviour. */
const IS_NATIVE_APP = !!(window.Capacitor && typeof window.Capacitor.isNativePlatform === 'function' && window.Capacitor.isNativePlatform());

// Inside the app the page address is https://localhost, which is useless inside a QR code
// that another phone scans. QR codes therefore point at the public web copy of the app
// (same Supabase data). Change this one line if the web address ever changes.
const PUBLIC_WEB_URL = 'https://hilarious-youtiao-3ba75b.netlify.app/';
function appBaseUrl(){ return IS_NATIVE_APP ? PUBLIC_WEB_URL : (location.origin + location.pathname); }

// Inside the Android app the bridge injects every installed plugin on Capacitor.Plugins
// (there is no registerPlugin without a bundler), so that is the primary lookup.
function nativePlugin(name){
  const cap = window.Capacitor || {};
  if(cap.Plugins && cap.Plugins[name]) return cap.Plugins[name];
  if(typeof cap.registerPlugin === 'function') return cap.registerPlugin(name);
  throw new Error('Native plugin not available: ' + name);
}

function utf8ToBase64(str){
  const bytes = new TextEncoder().encode(str);
  let bin = '';
  for(let i = 0; i < bytes.length; i += 0x8000){
    bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  }
  return btoa(bin);
}

// Android WebView can't download blob:/data: links, so files are written to the app cache
// and handed to the system share sheet (save to Drive / Files, send on WhatsApp, open...).
async function saveAndShareFile(filename, mimeType, base64Data){
  if(IS_NATIVE_APP){
    try{
      const written = await nativePlugin('Filesystem').writeFile({ path: filename, data: base64Data, directory: 'CACHE' });
      await nativePlugin('Share').share({ title: filename, url: written.uri, dialogTitle: trText('حفظ أو مشاركة الملف') });
      return true;
    }catch(e){
      const msg = (e && e.message) ? e.message : String(e);
      if(/cancel/i.test(msg)) return false; // user simply closed the share sheet
      console.error('saveAndShareFile failed:', msg);
      alert(trText('تعذر حفظ الملف') + ': ' + msg);
      return false;
    }
  }
  const a = document.createElement('a');
  a.href = 'data:' + mimeType + ';base64,' + base64Data;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  return true;
}

// Printing: browsers print directly; Android WebView has no print dialog, so the sheet is
// shared as an .html file that opens in Chrome, where "Print / Save as PDF" works.
async function shareOrPrintSheet(sheetHtml, dateStr){
  if(IS_NATIVE_APP){
    await saveAndShareFile('attendance-sheet-' + dateStr + '.html', 'text/html', utf8ToBase64(sheetHtml));
    return;
  }
  const win = window.open('', '_blank');
  win.document.write(sheetHtml);
  win.document.close();
  win.focus();
  win.print();
}

// Hardware back button: close an open dialog / camera, else go to the login screen, else exit.
if(IS_NATIVE_APP){
  try{
    const AppPlugin = nativePlugin('App');
    AppPlugin.addListener('backButton', () => {
      if(typeof window.appHandleBack === 'function'){ if(!window.appHandleBack()) AppPlugin.exitApp(); return; }
      AppPlugin.exitApp();
    });
  }catch(e){ console.warn('Back button handler not installed:', e && e.message); }
}

const EN_RE = (function(){
  const AR = 'ء-ي';
  const keys = Object.keys(EN_MAP).sort((a,b)=>b.length-a.length);
  const esc = s => s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
  const parts = keys.map(k=>{
    const first = k[0], last = k[k.length-1];
    const pre = new RegExp('['+AR+']').test(first) ? '(?<![' + AR + '])' : '';
    const post = new RegExp('['+AR+']').test(last) ? '(?![' + AR + '])' : '';
    return pre + esc(k) + post;
  });
  return new RegExp(parts.join('|'),'g');
})();
const AR_CHAR = /[؀-ۿ]/;
function trText(s){
  if(currentLang !== 'en' || typeof s !== 'string' || !AR_CHAR.test(s)) return s;
  if(EN_MAP[s.trim()] !== undefined) return s.replace(s.trim(), EN_MAP[s.trim()]);
  let out = s.replace(/[٠-٩]/g, d => String(d.charCodeAt(0)-0x0660));
  out = out.replace(/(\d{1,2}:\d{2})\s*ص/g,'$1 AM').replace(/(\d{1,2}:\d{2})\s*م/g,'$1 PM');
  out = out.replace(EN_RE, m => EN_MAP[m]);
  return out;
}
function pctSign(){ return currentLang==='en' ? '%' : '٪'; }

(function installEnglishLayer(){
  if(currentLang !== 'en') return;
  const _alert = window.alert.bind(window), _confirm = window.confirm.bind(window);
  window.alert = m => _alert(trText(String(m)));
  window.confirm = m => _confirm(trText(String(m)));
  if(window.XLSX && XLSX.utils){
    const _aoa = XLSX.utils.aoa_to_sheet.bind(XLSX.utils);
    XLSX.utils.aoa_to_sheet = (aoa, o) => _aoa(aoa.map(r => Array.isArray(r) ? r.map(c => typeof c==='string' ? trText(c) : c) : r), o);
    const _app = XLSX.utils.book_append_sheet.bind(XLSX.utils);
    XLSX.utils.book_append_sheet = (wb, ws, name, ...rest) => _app(wb, ws, name ? trText(name).replace(/[\\\/\?\*\[\]:]/g,' ').slice(0,31) : name, ...rest);
  }
  const ATTRS = ['placeholder','title','aria-label','alt'];
  let busy = false;
  function walk(root){
    if(!root) return;
    if(root.nodeType === 3){ const v = trText(root.nodeValue); if(v !== root.nodeValue) root.nodeValue = v; return; }
    if(root.nodeType !== 1) return;
    const tag = root.tagName;
    if(tag === 'SCRIPT' || tag === 'STYLE') return;
    ATTRS.forEach(a => { if(root.hasAttribute(a)){ const v = root.getAttribute(a), n = trText(v); if(n !== v) root.setAttribute(a, n); } });
    for(let c = root.firstChild; c; c = c.nextSibling) walk(c);
  }
  const mo = new MutationObserver(muts => {
    if(busy) return;
    busy = true;
    try{
      for(const m of muts){
        if(m.type === 'childList') m.addedNodes.forEach(walk);
        else if(m.type === 'characterData') walk(m.target);
        else if(m.type === 'attributes') walk(m.target);
      }
    }finally{ busy = false; }
  });
  function start(){
    walk(document.body);
    mo.observe(document.body, {childList:true, subtree:true, characterData:true, attributes:true, attributeFilter:ATTRS});
    document.title = 'Attendance Register';
  }
  if(document.body) start(); else document.addEventListener('DOMContentLoaded', start);
})();

// Returns the number of days from today until this student's next birthday
// (0 = today, up to 6 = within the coming week), or null if no birth date
// is on file. Compares month/day only, ignoring the birth year.
/* ---------------- dates, age, gender (the date of birth is the ONLY stored source of truth for age) ---------------- */
const APP_TZ = 'Africa/Cairo';            // one timezone for "today" everywhere
function todayStr(){
  try{
    const p = new Intl.DateTimeFormat('en-CA', { timeZone:APP_TZ, year:'numeric', month:'2-digit', day:'2-digit' }).formatToParts(new Date());
    const g = k => p.find(x => x.type === k).value;
    return `${g('year')}-${g('month')}-${g('day')}`;
  }catch(e){
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  }
}
function daysInMonth(y, m){ return new Date(Date.UTC(y, m, 0)).getUTCDate(); }
function parseIso(s){
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(s||''));
  if(!m) return null;
  const y = +m[1], mo = +m[2], d = +m[3];
  if(mo < 1 || mo > 12 || d < 1 || d > daysInMonth(y, mo)) return null;
  return { y, m:mo, d };
}
const cmpDate = (a, b) => (a.y - b.y) || (a.m - b.m) || (a.d - b.d);
// Completed years + months between a date of birth and `ref` (default: today in APP_TZ).
// A month is complete on the same day-of-month, clamped to the month's last day, so a 29 Feb
// birthday is reached on 28 Feb in non-leap years. Returns null for a missing / invalid / future date.
function ageParts(dob, ref){
  const b = parseIso(dob), t = parseIso(ref || todayStr());
  if(!b || !t || cmpDate(b, t) > 0) return null;
  let months = (t.y - b.y) * 12 + (t.m - b.m);
  const anniv = k => { const tm = b.m - 1 + k, yy = b.y + Math.floor(tm / 12), mm = (tm % 12) + 1; return { y:yy, m:mm, d:Math.min(b.d, daysInMonth(yy, mm)) }; };
  if(cmpDate(anniv(months), t) > 0) months--;
  if(months < 0) return null;
  return { years:Math.floor(months / 12), months:months % 12, totalMonths:months };
}
function dobError(dob, ref){            // null when fine, otherwise a message key (Arabic text)
  if(!dob) return 'اكتب تاريخ الميلاد';
  const b = parseIso(dob);
  if(!b) return 'تاريخ الميلاد غير صالح';
  if(cmpDate(b, parseIso(ref || todayStr())) > 0) return 'تاريخ الميلاد في المستقبل';
  const a = ageParts(dob, ref);
  if(!a || a.years > 120) return 'تاريخ الميلاد غير صالح';
  return null;
}
function ageYears(dob, ref){ const a = ageParts(dob, ref); return a ? a.years : null; }

    return a.years ? (a.months ? `${y} and ${m}` : y) : (a.months ? m : 'under 1 month');
  }
  return a.years ? (a.months ? `${a.years} سنة و${a.months} شهور` : `${a.years} سنة`) : (a.months ? `${a.months} شهور` : 'أقل من شهر');
}
function ageSpan(dob, mode){
  if(!parseIso(dob) || !ageParts(dob)) return '';
  return `<span class="age-live" data-dob="${escapeHtml(dob)}" data-mode="${mode||'years'}">${mode === 'full' ? ageLabelFull(dob) : ageLabelYears(dob)}</span>`;
}
// next birthday in whole days (0 = today). 29 Feb is celebrated on 28 Feb in non-leap years.
function daysUntilBirthday(birthDate, ref){
  const b = parseIso(birthDate), t = parseIso(ref || todayStr());
  if(!b || !t) return null;
  const when = y => ({ y, m:b.m, d:Math.min(b.d, daysInMonth(y, b.m)) });
  let n = when(t.y);
  if(cmpDate(n, t) < 0) n = when(t.y + 1);
  return Math.round((Date.UTC(n.y, n.m - 1, n.d) - Date.UTC(t.y, t.m - 1, t.d)) / 86400000);
}
function isBirthdayThisWeek(student, ref){
  const d = daysUntilBirthday(student.birthDate, ref);
  return d !== null && d <= 6;
}

const GENDER_META = { male:{ ar:'ولد', en:'Boy', icon:'👦' }, female:{ ar:'بنت', en:'Girl', icon:'👧' } };
function genderOf(s){ return (s && (s.gender === 'male' || s.gender === 'female')) ? s.gender : ''; }
function genderLabel(g){ return g ? (currentLang === 'en' ? GENDER_META[g].en : GENDER_META[g].ar) : ''; }
function genderStats(students){
  const total = students.length;
  const boys = students.filter(s => genderOf(s) === 'male').length;
  const girls = students.filter(s => genderOf(s) === 'female').length;
  const pc = n => total ? Math.round(n / total * 100) : 0;
  return { total, boys, girls, unknown: total - boys - girls, boysPct: pc(boys), girlsPct: pc(girls) };
}
const AGE_GROUPS = [
  { id:'u10',  label:'أقل من 10', test:y => y < 10 },
  { id:'10_12', label:'10 – 12',  test:y => y >= 10 && y <= 12 },
  { id:'13_15', label:'13 – 15',  test:y => y >= 13 && y <= 15 },
  { id:'o15',  label:'أكبر من 15', test:y => y > 15 }
];
function ageStats(students, ref){
  const known = students.map(s => ({ s, a: ageParts(s.birthDate, ref) })).filter(x => x.a);
  const groups = AGE_GROUPS.map(g => ({ id:g.id, label:g.label, count: known.filter(x => g.test(x.a.years)).length }));
  let avg = null, youngest = null, oldest = null;
  if(known.length){
    avg = Math.round(known.reduce((t, x) => t + x.a.totalMonths, 0) / known.length / 12 * 10) / 10;
    youngest = known.reduce((m, x) => x.a.totalMonths < m.a.totalMonths ? x : m);
    oldest = known.reduce((m, x) => x.a.totalMonths > m.a.totalMonths ? x : m);
  }
  return { count: known.length, missing: students.length - known.length, avg, youngest, oldest, groups };
}
function passesStudentFilters(s, f){
  if(!f) return true;
  if(f.gender && f.gender !== 'all'){
    const g = genderOf(s);
    if(f.gender === 'unknown' ? g !== '' : g !== f.gender) return false;
  }
  const hasAge = (f.ageMin !== '' && f.ageMin != null) || (f.ageMax !== '' && f.ageMax != null);
  if(hasAge){
    const y = ageYears(s.birthDate);
    if(y === null) return false;
    if(f.ageMin !== '' && f.ageMin != null && y < +f.ageMin) return false;
    if(f.ageMax !== '' && f.ageMax != null && y > +f.ageMax) return false;
  }
  return true;
}

function genderBadge(s){

}
function studentMetaHtml(s){

function classStatsInner(students){
  const g = genderStats(students), a = ageStats(students);
  const cell = (label, big, sub, color) => `<div class="gcell"><div class="gl">${label}</div><div class="gn" ${color ? `style="color:${color}"` : ''}>${big}</div>${sub ? `<div class="gs">${sub}</div>` : ''}</div>`;
  return `
    <div class="gstats">
      ${cell('إجمالي المخدومين', g.total)}
      ${cell('الأولاد', g.boys, g.boysPct + pctSign(), 'var(--boyc)')}
      ${cell('البنات', g.girls, g.girlsPct + pctSign(), 'var(--girlc)')}
    </div>
    ${g.unknown ? `<div class="stu-note">غير محدد النوع: ${g.unknown} (مش محسوبين ولد أو بنت)</div>` : ''}
    <div class="gstats" style="margin-top:8px;">
      ${cell('متوسط العمر', a.avg === null ? '—' : (currentLang === 'en' ? a.avg + ' y' : a.avg + ' سنة'))}
      ${cell('الأصغر', a.youngest ? ageLabelYears(a.youngest.s.birthDate) : '—', a.youngest ? escapeHtml(a.youngest.s.name) : '')}
      ${cell('الأكبر', a.oldest ? ageLabelYears(a.oldest.s.birthDate) : '—', a.oldest ? escapeHtml(a.oldest.s.name) : '')}
    </div>
    <div class="agegroups">${a.groups.map(x => `<span class="agchip">${x.label}: <b>${x.count}</b></span>`).join('')}</div>
    ${a.missing ? `<div class="stu-note">بدون تاريخ ميلاد: ${a.missing}</div>` : ''}`;
}

// Applies the search box + quick filter chips against one class's student
// list. `attendance` is that class's attendance data, needed for the
// attendance-rate and repeated-absence filters.
function filterServants(students, attendance, query, filter, extra){
  const q = (query||'').trim().toLowerCase();
  return students.filter(s=>{
    if(q && !(s.name||'').toLowerCase().includes(q) && !(s.mobile||'').includes(q)) return false;
    if(!passesStudentFilters(s, extra)) return false;
    if(filter === 'low'){
      const st = calcStats(attendance, s.id);
      if(st.pct === null || st.pct >= 60) return false;
    }else if(filter === 'repeated'){
      if(currentAbsenceStreak(attendance, s.id) < 3) return false;
    }else if(filter === 'birthday'){
      if(!isBirthdayThisWeek(s)) return false;
    }
    return true;
  });
}

const APP_BUILD = 'v3.2';
// Excel library: normally embedded in this file; if it is missing for any reason, try to fetch it before giving up.
let _xlsxLoading = null;
function ensureXlsx(){
  if(typeof XLSX !== 'undefined') return Promise.resolve(true);
  if(_xlsxLoading) return _xlsxLoading;
  const urls = ['https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js','https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js','https://unpkg.com/xlsx@0.18.5/dist/xlsx.full.min.js'];
  _xlsxLoading = (async () => {
    for(const u of urls){
      const ok = await new Promise(res => { const sc = document.createElement('script'); sc.src = u; sc.onload = () => res(true); sc.onerror = () => { sc.remove(); res(false); }; document.head.appendChild(sc); });
      if(ok && typeof XLSX !== 'undefined') return true;
    }
    return false;
  })().finally(() => { _xlsxLoading = null; });
  return _xlsxLoading;
}
const XLSX_MISSING_MSG = () => 'مكتبة الإكسيل لم يتم تحميلها (' + APP_BUILD + '). تأكد من اتصال الإنترنت وحدّث الصفحة';

async function exportMonthlyReport(){
  const input = document.getElementById('reportMonth');
  const note = document.getElementById('reportNote');
  const month = input && input.value;
  const say = (msg, color) => { if(note){ note.textContent = msg; note.style.color = color || '#7B8194'; } };
  if(!month){ say('اختار الشهر الأول.', 'var(--bad)'); return; }
  if(!(await ensureXlsx())){ say(XLSX_MISSING_MSG(), 'var(--bad)'); return; }
  if(!classes.length){ say('مفيش فصول لسه.', 'var(--bad)'); return; }
  say('جارِ تجهيز التقرير...');
  const summary = [['الفصل','الخادم','عدد المخدومين','الأولاد','البنات','متوسط العمر','حاضر','غايب','نسبة الحضور %']];
  const sheets = [];
  const usedNames = new Set(['ملخص الكنيسة']);
  let anyData = false;
  for(const c of classes){
    const att = await loadAttendance(c.id);
    const dates = Object.keys(att).filter(d => d.startsWith(month)).sort();
    if(dates.length) anyData = true;
    let P=0, L=0, A=0, E=0;
    const rows = [['الاسم','النوع','العمر', ...dates, 'حاضر','غايب','النسبة %']];
    c.students.forEach(st => {
      let p=0, l=0, a=0, e=0;
      const row = [st.name, genderLabel(genderOf(st)) || 'غير محدد', ageYears(st.birthDate) === null ? '' : ageYears(st.birthDate)];
      dates.forEach(d => {
        const m = normalizeMark((att[d] || {})[st.id]);
        row.push(m ? STATUS_META[m.status].label : '');
        if(m){ if(m.status==='present') p++; else if(m.status==='late') l++; else if(m.status==='absent') a++; else if(m.status==='excused') e++; }
      });
      const counted = p + a;
      row.push(p, a, counted ? Math.round(p/counted*100) : '');
      rows.push(row);
      P+=p; L+=l; A+=a; E+=e;
    });
    const counted = P + A;
    const gs = genderStats(c.students), as = ageStats(c.students);
    summary.push([c.className, c.teacherName, c.students.length, gs.boys, gs.girls, as.avg === null ? '' : as.avg, P, A, counted ? Math.round(P/counted*100) : '']);
    let name = (c.className || 'فصل').replace(/[\\\/\?\*\[\]:]/g, ' ').trim().slice(0, 28) || 'فصل';
    let n = name, i = 2;
    while(usedNames.has(n)){ n = name.slice(0, 26) + ' ' + i++; }
    usedNames.add(n);
    sheets.push([n, rows]);
  }
  if(!anyData){ say('مفيش حضور مسجل في الشهر ده.', 'var(--bad)'); return; }
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(summary), 'ملخص الكنيسة');
  sheets.forEach(([n, rows]) => XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(rows), n));
  try{
    await saveWorkbook(wb, `تقرير-${month}.xlsx`, `report-${month}.xlsx`);
    say('تم تجهيز التقرير ✓', 'var(--good)');
  }catch(e){ say('تعذر تصدير التقرير: ' + (e.message || e), 'var(--bad)'); }
}

/* ---------------- PWA (best-effort) ----------------
   This is a single self-contained HTML file with no separate server, so
   the manifest and service worker are generated in-memory (as Blob URLs)
   rather than served as real /manifest.json and /sw.js files. That's
   enough for "Add to Home Screen" and caching the app shell for offline
   reopening on most Android/desktop browsers. It does NOT give real
   push notifications while the app is fully closed — that needs a
   backend push server (VAPID keys, etc.) which a single HTML file can't
   provide. What we *can* do without a backend is local notifications
   fired while the tab is open or recently backgrounded. */

// Minimal offline app-shell cache: caches the page itself on first load,
// then serves it from cache if the network request fails later. This same
// source is also written out to a real sw.js file (see below) — real
// hosting (Netlify etc.) can serve it as an actual file, which is far more
// reliable than registering a service worker from a blob: URL (several
// browsers and in-app browsers either block that outright or, as seen in
// testing, silently rewrite the URL scheme so registration fails).
const SW_SOURCE = `
  const CACHE = 'attendance-app-v1';
  self.addEventListener('install', e => self.skipWaiting());
  self.addEventListener('activate', e => self.clients.claim());
  self.addEventListener('fetch', e => {
    if(e.request.method !== 'GET' || new URL(e.request.url).origin !== self.location.origin) return;
    e.respondWith(
      fetch(e.request).then(res => {
        const copy = res.clone();
        caches.open(CACHE).then(c => c.put(e.request, copy));
        return res;
      }).catch(() => caches.match(e.request))
    );
  });
  self.addEventListener('push', e => {
    const data = e.data ? e.data.text() : 'تذكير من تطبيق الحضور';
    self.registration.showNotification('سجل الحضور', { body: data, icon: '${APP_ICON_DATAURI}' });
  });
`;

async function registerServiceWorker(){
  if(!('serviceWorker' in navigator)) return;
  // Prefer a real sw.js next to this page (works when uploaded alongside
  // it, e.g. on Netlify). Falls back to the blob: trick only if that 404s —
  // that fallback is best-effort and known to fail on some browsers.
  try{
    await navigator.serviceWorker.register('sw.js');
    return;
  }catch(e){
    console.warn('sw.js not found next to this page, trying a blob fallback:', e.message);
  }
  try{
    const blob = new Blob([SW_SOURCE], { type: 'application/javascript' });
    await navigator.serviceWorker.register(URL.createObjectURL(blob));
  }catch(e){
    console.warn('Service worker registration skipped (offline caching + install prompt will still work without it):', e.message);
  }
}

// Normalizes a stored attendance entry to {status, time}. Handles the
// legacy boolean format (true/false) from before 4-state attendance existed.
function normalizeMark(raw){
  if(raw === undefined || raw === null) return undefined;
  if(typeof raw === 'boolean') return { status: raw ? 'present' : 'absent', time: null };
  if(typeof raw === 'object' && raw.status){
    // Only Present / Absent exist now. Old records are kept untouched in storage and simply read
    // as the nearest status: late -> present, excused -> absent.
    if(raw.status === 'late') return { status:'present', time: raw.time || null, legacy:'late' };
    if(raw.status === 'excused') return { status:'absent', time: raw.time || null, legacy:'excused' };
    return raw;
  }
  return undefined;
}

// supabase-js silently retries failed requests with growing waits (1s + 2s + 4s),
// so one unreachable server used to freeze every screen for ~7 seconds before the
// app fell back to local storage. These helpers turn that off, cap each request with
// a timeout, and — once the server is known to be unreachable — skip it for a short
// while so the following taps are instant instead of each waiting out its own timeout.
const DB_READ_TIMEOUT_MS = 6000;
const DB_WRITE_TIMEOUT_MS = 15000;
const DB_DOWN_COOLDOWN_MS = 15000;
let dbDownUntil = 0;
// Why the last write failed: a network problem (just retry later) or a real
// server-side rejection (permissions / missing table: the user must be told).
let lastDbFailure = null;
function isNetworkMessage(m){ return /fetch|network|abort|timeout|timed out|load failed|offline/i.test(m || ''); }

function dbRemoteUnavailable(){
  // navigator.onLine is NOT trusted: some Android WebViews report false while the phone is online, which used to block every sync.
  return Date.now() < dbDownUntil;
}
function dbFastFail(builder, timeoutMs){
  if(typeof builder.retry === 'function') builder = builder.retry(false);
  if(typeof AbortSignal !== 'undefined' && typeof AbortSignal.timeout === 'function' && typeof builder.abortSignal === 'function'){
    builder = builder.abortSignal(AbortSignal.timeout(timeoutMs));
  }
  return builder;
}


/* ---------------- SECURE MODE (server-enforced permissions) ----------------
   Active only when supabase-secure.sql has been run on the project (detected through the
   app_mode() function). Then:
     • the admin is a real Supabase Auth user (email + password) and is the only one who can touch the table directly;
     • a teacher never sees the table: every call goes through a function that checks that teacher's own
       class (QR secret or username/password) on the SERVER;
     • students check in with a per-student token inside their card.
   When the function does not exist the app keeps working exactly as before (open mode). */
let secureMode = false;
let secureInfo = null;

let teacherCtx = null;               // { classId, secret }
let qrKeys = {};                     // classId -> secret baked into that class's QR codes
try{ secureMode = localStorage.getItem('__secure') === '1'; }catch(e){}

async function sbRpc(name, args){
  try{
    const { data, error } = await dbFastFail(supabaseClient.rpc(name, args || {}), DB_WRITE_TIMEOUT_MS);
    if(error){
      const msg = error.message || error.code || String(error);
      const network = isNetworkMessage(msg);
      if(network) dbDownUntil = Date.now() + DB_DOWN_COOLDOWN_MS;
      return { ok:false, error:msg, network, missing: /could not find|not exist|404|PGRST202/i.test(msg) };
    }
    return (data && typeof data === 'object') ? data : { ok:true, value:data };
  }catch(e){
    dbDownUntil = Date.now() + DB_DOWN_COOLDOWN_MS;
    return { ok:false, error:e.message || String(e), network:true };
  }
}

  if(!usingSupabase()) return;
  const r = await sbRpc('app_mode');
  if(r && r.secure){ secureMode = true; secureInfo = r; try{ localStorage.setItem('__secure','1'); }catch(e){} }
  else if(r && r.network){ /* offline: keep what we knew last time */ }
  else { secureMode = false; secureInfo = null; try{ localStorage.removeItem('__secure'); }catch(e){} }

function secureFail(r){

}
async function secureDbGet(key){
  if(dbRemoteUnavailable()) return null;
  if(teacherCtx){
    const { classId, secret } = teacherCtx;
    if(key === 'classes-data'){
      const r = await sbRpc('t_get_class', { p_class:classId, p_secret:secret });
      if(!r.ok){ secureFail(r); return null; }
      return r.class ? JSON.stringify([r.class]) : null;
    }
    const m = key.match(/^(attendance|photos)-(.+)$/);
    if(m && m[2] === classId){
      const r = await sbRpc('t_get_kv', { p_class:classId, p_secret:secret, p_kind:m[1] });
      if(!r.ok){ secureFail(r); return null; }
      return r.value == null ? null : r.value;
    }

  }

}
// The server rejects a whole save if ONE student has a malformed gender / birth date (old free-text data, for example).
// Only the copy sent to the server is cleaned; the device copy is never touched, and nothing valid is changed.
function serverSafeStudents(list){
  return (list || []).map(st => {
    if(!st || typeof st !== 'object') return st;
    let o = st, g = st.gender, b = st.birthDate;
    if(g != null && g !== '' && g !== 'male' && g !== 'female'){ o = Object.assign({}, o, { gender:'' }); }
    if(b != null && b !== ''){
      const p = (typeof b === 'string') ? parseIso(b) : null;
      if(!p || cmpDate(p, parseIso(todayStr())) > 0 || p.y < 1900) o = Object.assign({}, o, { birthDate:'' });
    }
    if(typeof o.name === 'string' && o.name.length > 120) o = Object.assign({}, o, { name:o.name.slice(0,120) });
    return o;
  });
}
function syncFailReason(){
  const f = lastDbFailure; if(!f) return '';
  const m = String(f.message || '');
  if(m === 'no-session') return 'سجّل دخول تاني عشان تتزامن';
  if(m === 'offline') return '';
  if(/PGRST202|Could not find the function|does not exist/i.test(m)) return 'شغّل ملف SQL الجديد في Supabase';
  if(m === 'denied' || /JWT|permission|policy|row-level|401|403/i.test(m)) return 'انتهت صلاحية الدخول — اعمل دخول تاني';
  if(m === 'inactive') return 'الفصل ده معطّل';
  if(m === 'bad_birthdate') return 'تاريخ ميلاد غير صالح عند أحد المخدومين';
  if(m === 'bad_gender') return 'قيمة النوع غير صالحة';
  if(m === 'bad_input') return 'بيانات غير صالحة';
  return f.network ? '' : m.slice(0, 60);
}
async function secureDbSet(key, value){
  if(dbRemoteUnavailable()){ lastDbFailure = { network:true, message:'offline' }; return false; }
  if(teacherCtx){
    const { classId, secret } = teacherCtx;
    let r;
    if(key === 'classes-data'){
      let cls = null;
      try{ cls = (JSON.parse(value) || []).find(c => c.id === classId); }catch(e){}
      if(!cls) return true;
      r = await sbRpc('t_save_students', { p_class:classId, p_secret:secret, p_students:serverSafeStudents(cls.students || []) });
    }else{
      const m = key.match(/^(attendance|photos)-(.+)$/);
      if(!m || m[2] !== classId) return true;           // anything else is not this teacher's to write
      r = await sbRpc('t_set_kv', { p_class:classId, p_secret:secret, p_kind:m[1], p_value:value });
    }
    if(r.ok){ dbDownUntil = 0; lastDbFailure = null; return true; }
    return secureFail(r);
  }
  if(adminSession) return await adminDbSet(key, value);
  lastDbFailure = { network:true, message:'no-session' };
  return false;
}

async function dbGet(key) {
  if (!supabaseClient) return null;
  if (secureMode) return secureDbGet(key);
  return adminDbGet(key);
}
async function dbSet(key, value) {
  if (!supabaseClient) return false;
  if (secureMode) return secureDbSet(key, value);
  return adminDbSet(key, value);
}
async function adminDbGet(key) {
  if (!supabaseClient) return null;
  if (dbRemoteUnavailable()) return null;
  try{
    const { data, error } = await dbFastFail(
      supabaseClient.from('app_storage').select('value').eq('key', key).maybeSingle(),
      DB_READ_TIMEOUT_MS);
    if (error) {
      console.error('Supabase read error:', error.message || error.code || JSON.stringify(error));
      if(isNetworkMessage(error.message)) dbDownUntil = Date.now() + DB_DOWN_COOLDOWN_MS;
      return null;
    }
    dbDownUntil = 0;
    return data ? data.value : null;
  }catch(e){
    dbDownUntil = Date.now() + DB_DOWN_COOLDOWN_MS;
    console.error('Supabase read exception:', e.message || String(e));
    return null;
  }
}

async function adminDbSet(key, value) {
  if (!supabaseClient) return false;
  if (dbRemoteUnavailable()){ lastDbFailure = { network:true, message:'offline' }; return false; }
  try{
    const { error } = await dbFastFail(
      supabaseClient.from('app_storage').upsert(
        { key, value, updated_at: new Date().toISOString() },
        { onConflict: 'key' }),
      DB_WRITE_TIMEOUT_MS);
    if (error) {
      const msg = error.message || error.code || JSON.stringify(error);
      console.error('Supabase save error:', msg);
      const network = isNetworkMessage(msg);
      if(network) dbDownUntil = Date.now() + DB_DOWN_COOLDOWN_MS;
      lastDbFailure = { network, message: msg };
      return false;
    }
    dbDownUntil = 0;
    lastDbFailure = null;
    return true;
  }catch(e){
    dbDownUntil = Date.now() + DB_DOWN_COOLDOWN_MS;
    lastDbFailure = { network:true, message: e.message || String(e) };
    console.error('Supabase save exception:', e.message || String(e));
    return false;
  }
}

/* ---------------- offline-safe storage + sync queue ----------------
   Every save is written to this device FIRST (so nothing is lost if the phone
   has no signal, or the app is closed mid-request) and the key is queued as
   "pending" until the server confirms it. Pending keys are re-sent
   automatically when the connection comes back, when the app is reopened, and
   every 20 seconds. While a key is pending, reads use the local copy so the
   server's older value can never hide what was just recorded. */
const PENDING_KEY = '__pending_sync__';
function pendingKeys(){
  try{ return new Set(JSON.parse(localStorage.getItem(PENDING_KEY) || '[]')); }
  catch(e){ return new Set(); }
}
function savePendingKeys(set){
  try{ localStorage.setItem(PENDING_KEY, JSON.stringify([...set])); }catch(e){}
}
function addPending(key){ const set = pendingKeys(); set.add(key); savePendingKeys(set); }
function removePending(key){ const set = pendingKeys(); if(set.delete(key)) savePendingKeys(set); }

// Called after the server confirmed `sentValue`. If the user changed the same key
// again while the request was in flight, it stays queued and goes out next round.
function settleKey(key, sentValue){
  let current = null;
  try{ current = localStorage.getItem(key); }catch(e){}
  if(current === sentValue || current === null) removePending(key);
}

async function storageGet(key) {
  const lk = lkey(key);
  if (usingSupabase() && !pendingKeys().has(lk)) {
    const remote = await dbGet(key);
    if (remote !== null) {
      try{ localStorage.setItem(lk, remote); }catch(e){}   // keep an offline copy fresh
      return { value: remote };
    }
  }
  try {
    const value = localStorage.getItem(lk);
    return value === null ? null : { value };
  } catch (e) {
    console.error('Local storage read error:', e);
    return null;
  }
}

async function storageSet(key, value) {
  const lk = lkey(key);
  let localOk = false;
  try { localStorage.setItem(lk, value); localOk = true; }
  catch (e) { console.error('Local storage save error:', e); }
  if (!usingSupabase()) {
    if (!localOk) showSyncFailureWarning('التخزين على الجهاز ممتلئ — التغيير الأخير ممكن يضيع');
    return localOk;
  }

  addPending(lk);
  const ok = await dbSet(key, value);
  if (ok) { settleKey(lk, value); updateSyncBadge(); return true; }
  if (!localOk) showSyncFailureWarning('التخزين على الجهاز ممتلئ والسيرفر مش متاح — التغيير الأخير ممكن يضيع');

  // A network problem is normal in a church hall: the change is queued and the
  // badge says so. Only a real server rejection gets the loud red warning.
  if (lastDbFailure && !lastDbFailure.network) showSyncFailureWarning(lastDbFailure.message);
  updateSyncBadge();
  return localOk;
}

let flushing = false;
// A teacher's private copy (classes-data@<class>) can only be sent by that teacher. It must not keep the admin's badge on forever.
function isSendableKey(key){
  if(key.startsWith('classes-data@')) return !!(secureMode && teacherCtx && key === 'classes-data@' + teacherCtx.classId);
  return true;
}
function sendablePending(){ return [...pendingKeys()].filter(isSendableKey); }
async function flushPending(force){
  if (!usingSupabase() || flushing) return;
  const keys = sendablePending();
  if (!keys.length) { updateSyncBadge(); return; }
  if (force) dbDownUntil = 0;
  if (dbRemoteUnavailable()) { updateSyncBadge(); return; }
  flushing = true;
  let sent = 0;
  try{
    for (const key of keys) {
      let value = null;
      try{ value = localStorage.getItem(key); }catch(e){}
      if (value === null) { removePending(key); continue; }
      let rkey = key;
      if (key.startsWith('classes-data@')) rkey = 'classes-data';
      if (secureMode && !teacherCtx && !adminSession) { lastDbFailure = { network:true, message:'no-session' }; break; }   // nobody signed in yet: keep it queued
      const ok = await dbSet(rkey, value);
      if (!ok) {
        if (lastDbFailure && !lastDbFailure.network) { showSyncFailureWarning(lastDbFailure.message); continue; }   // a rejected key must not block the others
        break;                                                                                                         // network trouble: stop and retry later
      }
      settleKey(key, value);
      sent++;
    }
  } finally { flushing = false; }
  updateSyncBadge(sent && !sendablePending().length ? 'synced' : undefined);
}

/* ---------------- sync diagnostics: finds the REAL reason instead of guessing "no internet" ---------------- */
async function probeFetch(url, opts, ms){
  const ac = new AbortController(), tm = setTimeout(() => ac.abort(), ms);
  try{ const r = await fetch(url, Object.assign({ signal: ac.signal, cache:'no-store' }, opts || {})); return { ok:true, status:r.status }; }
  catch(e){ return { ok:false, error: e && e.name === 'AbortError' ? 'انتهت المهلة' : ((e && e.message) || String(e)) }; }
  finally{ clearTimeout(tm); }
}
async function runSyncDiagnostics(onStep){
  const steps = [], add = (ok, label, detail) => { steps.push({ ok, label, detail }); if(onStep) onStep(steps); };
  let verdict = '';
  const net = await probeFetch('https://www.gstatic.com/generate_204', { mode:'no-cors' }, 7000);
  add(net.ok, 'الإنترنت على الجهاز', net.ok ? 'شغّال' : 'مش قادر يوصل لأي موقع (' + net.error + ')');
  const sb = await probeFetch(SUPABASE_URL + '/rest/v1/', { headers:{ apikey: SUPABASE_PUBLISHABLE_KEY } }, 12000);
  if(!sb.ok) add(false, 'الوصول لسيرفر قاعدة البيانات', 'مفيش رد (' + sb.error + ')');
  else add(sb.status < 500, 'الوصول لسيرفر قاعدة البيانات', 'رد برقم ' + sb.status);
  if(!net.ok) verdict = 'مفيش اتصال فعلي بالإنترنت على الموبايل ده. شغّل الواي فاي أو الداتا وجرّب تاني.';
  else if(!sb.ok) verdict = 'النت شغّال لكن سيرفر قاعدة البيانات مش بيرد. أغلب الظن مشروع Supabase موقوف (Paused) لأنه اتساب أكتر من أسبوع. ادخل على supabase.com ← مشروعك ← اضغط Restore project، واستنى دقيقتين وجرّب تاني.';
  else if(sb.status >= 500) verdict = 'سيرفر Supabase بيرجّع خطأ ' + sb.status + '. جرّب بعد دقايق، ولو استمر راجع حالة المشروع في لوحة Supabase.';
  if(!verdict){
    if(secureMode && !teacherCtx && !adminSession){
      add(false, 'تسجيل الدخول', 'مش مسجّل دخول للسيرفر');
      verdict = 'لازم تسجّل دخول (كخادم أو كمسؤول) عشان التغييرات تتبعت للسيرفر. اعمل تسجيل خروج وادخل تاني.';
    }else{
      const d = await diagnoseSupabase();
      add(d.ok, 'قاعدة البيانات والدوال', d.ok ? 'سليمة' : (d.message || 'فيه مشكلة'));
      if(!d.ok){ verdict = /Could not find|PGRST202|does not exist/i.test(d.message || '') ? 'ملفات SQL في Supabase ناقصة. شغّل الملفات بالترتيب (secure ثم v2 ثم v3) من SQL Editor.' : 'القاعدة بترفض الطلب: ' + (d.message || ''); }
      else{
        dbDownUntil = 0; lastDbFailure = null;
        const before = sendablePending().length;
        await flushPending(true);
        const left = sendablePending().length;
        add(left === 0, 'إرسال التغييرات المعلّقة', left === 0 ? (before ? 'اتبعت ' + before + ' تغيير بنجاح' : 'مفيش حاجة معلّقة') : 'لسه ' + left + ' تغيير ما اتبعتش');
        if(left){ const why = syncFailReason(); verdict = why ? 'السيرفر ردّ لكن رفض الحفظ: ' + why : 'السيرفر ردّ لكن التغييرات ما اتبعتش. جرّب تاني بعد شوية.'; }
        else verdict = 'كل حاجة شغّالة ✅ — كل التغييرات اتزامنت.';
      }
    }
  }
  return { steps, verdict };
}

let syncBadgeTimer = null;
function updateSyncBadge(state){
  const n = sendablePending().length;
  const note = document.getElementById('syncPendingNote');
  if (note) {
    note.textContent = n ? `⏳ فيه ${n} تغيير لسه مستني المزامنة مع السيرفر` : '✅ كل التغييرات متزامنة مع السيرفر';
    note.style.color = n ? 'var(--late)' : 'var(--good)';
  }
  let el = document.getElementById('syncBadge');
  if (!n && state !== 'synced') { if (el) el.remove(); return; }
  if (!el) {
    el = document.createElement('div');
    el.id = 'syncBadge';
    el.onclick = () => openSyncDiagnostics();
    document.body.appendChild(el);
  }
  if (n) {
    el.className = 'sync-badge pending';
    const why = syncFailReason();
    el.textContent = why ? '⚠️ ' + why + ' · اضغط للتفاصيل' : '⏳ مستني المزامنة · اضغط للتفاصيل';
  } else {
    el.className = 'sync-badge done';
    el.textContent = '✅ تمت المزامنة';
    clearTimeout(syncBadgeTimer);
    syncBadgeTimer = setTimeout(() => {
      const e = document.getElementById('syncBadge');
      if (e && !sendablePending().length) e.remove();
    }, 2500);
  }
}

function normalizeClass(c){
  if(!Array.isArray(c.students)) c.students = [];
  if(!Array.isArray(c.servants)){
    c.servants = (c.username || c.teacherName)
      ? [{ id:'v' + String(c.id).replace(/[^A-Za-z0-9_-]/g, ''), name:c.teacherName || '', username:c.username || '', passwordHash:c.passwordHash || '' }]
      : [];
  }
  if(c.active === undefined) c.active = true;
  if(c.description === undefined) c.description = '';
  return c;
}
// the first servant is mirrored into the old single-servant fields so every older screen / export keeps working
function mirrorLegacy(c){
  const sv = c.servants || [];
  c.teacherName = sv.map(x => x.name).filter(Boolean).join('، ');
  c.username = sv[0] ? sv[0].username : '';
  c.passwordHash = sv[0] ? sv[0].passwordHash : '';
}
async function loadClasses(){
  if(secureMode && !teacherCtx && !adminSession){ classes = []; return; }   // nothing is readable before signing in
  try{
    const r = await storageGet('classes-data');
    classes = r ? JSON.parse(r.value) : [];
  }catch(e){ classes = []; console.error(e); }

  // Photos live under their own key per class (photos-<classId>) so the big base64 strings are not
  // rewritten / re-uploaded on every attendance tap or student edit. Older data that still has the
  // photo inside the student record is moved over automatically.
  let photosMigrated = false;
  await Promise.all(classes.map(async c => {
    let map = {};
    try{ const pr = await storageGet('photos-' + c.id); if(pr) map = JSON.parse(pr.value) || {}; }catch(e){}
    let legacy = false;
    (c.students || []).forEach(s => {
      if(s.photo){ legacy = true; }                    // legacy inline photo
      else s.photo = map[s.id] || null;
    });
    if(legacy){ photosMigrated = true; photoSnapshot[c.id] = '{}'; }   // forces the photos-<id> key to be written
    else photoSnapshot[c.id] = JSON.stringify(photoMapOf(c));
  }));

  // Older saved classes (created before login credentials existed) may be
  // missing username/passwordHash. Give them safe defaults instead of
  // silently breaking every screen that checks these fields.
  let migrated = false;
  for(const c of (teacherCtx ? [] : classes)){
    if(!c.username){
      c.username = 'user' + c.id.slice(-4);
      migrated = true;
    }
    if(!c.passwordHash){
      c.passwordHash = await sha256Hex('1234');
      migrated = true;
    }
  }
  let normalized = false;
  for(const c of classes){ if(!Array.isArray(c.servants) || c.active === undefined) normalized = true; normalizeClass(c); }
  if((migrated || photosMigrated || normalized) && !teacherCtx){ await saveClasses(); }
}
const photoSnapshot = {};
function photoMapOf(c){
  const m = {};
  (c.students || []).forEach(s => { if(s.photo) m[s.id] = s.photo; });
  return m;
}
async function saveClasses(){
  // 1) light class record without photos, 2) only the photo maps that actually changed
  await storageSet('classes-data', JSON.stringify(classes, (k, v) => k === 'photo' ? undefined : v));
  for(const c of classes){
    const snap = JSON.stringify(photoMapOf(c));
    if((photoSnapshot[c.id] ?? '{}') !== snap){
      photoSnapshot[c.id] = snap;
      await storageSet('photos-' + c.id, snap);
    }
  }
  if(secureMode && adminSession) await syncClassKeys();
}

// In-memory cache so rapid taps/typing (marking attendance, typing in the
// search box) don't each trigger a fresh storage/network round trip — the
// biggest source of the "slow after every action" feeling once Supabase
// sync was involved. The cache is invalidated whenever we know the
// underlying data changed from elsewhere (undo, import, etc.).
const attendanceCache = {};

function genRecoveryCode(){
  const A='ABCDEFGHJKMNPQRSTUVWXYZ23456789', r=new Uint8Array(16);
  crypto.getRandomValues(r);
  const s=[...r].map(x=>A[x%A.length]).join('');
  return s.match(/.{4}/g).join('-');
}

  const err=document.getElementById('recError');
  let tries=[]; try{ tries=JSON.parse(localStorage.getItem('__rec_tries')||'[]').filter(x=>Date.now()-x<15*60*1000); }catch(e){}
  if(tries.length>=5){ err.textContent='محاولات كتير. حاول بعد شوية'; return; }
  const code=document.getElementById('recCode').value, p=document.getElementById('recPass').value, p2=document.getElementById('recPass2').value;
  if(p.length<6){ err.textContent='كلمة السر لازم تكون 6 حروف على الأقل'; return; }
  if(p!==p2){ err.textContent='كلمة السر وتأكيدها مش متطابقين'; return; }
  const creds=await loadAdminCreds();
  if(!creds || !creds.recoveryHash){ err.textContent='لم يتم إعداد كود استرجاع لهذا الحساب. لو فقدت الدخول لازم تعدّل البيانات من قاعدة البيانات مباشرة'; return; }
  tries.push(Date.now()); try{ localStorage.setItem('__rec_tries',JSON.stringify(tries)); }catch(e){}
  if(await sha256Hex(normCode(code)) !== creds.recoveryHash){ err.textContent='الكود أو البيانات غير صحيحة'; return; }
  const newCode=genRecoveryCode();
  creds.passwordHash=await sha256Hex(p);
  creds.recoveryHash=await sha256Hex(normCode(newCode));
  await saveAdminCreds(creds);
  try{ localStorage.removeItem('__rec_tries'); }catch(e){}
  showRecoveryCode(newCode, () => { alert('تم تغيير كلمة السر ✓'); renderAdminLogin(); });
}

async function loadAdminCreds(){

async function saveAdminCreds(creds){

async function submitAdminSetup(){

  const err = document.getElementById('adminSetupError');

  if(secureMode){

    if(p.length < 6){ err.textContent = 'كلمة السر لازم تكون 6 حروف على الأقل'; return; }
    err.textContent = 'جارِ الإنشاء...';
    const su = await supabaseClient.auth.signUp({ email:u, password:p });
    if(su.error){ err.textContent = 'تعذر إنشاء الحساب: ' + su.error.message; return; }
    if(!su.data.session){
      const si = await supabaseClient.auth.signInWithPassword({ email:u, password:p });
      if(si.error || !si.data.session){ err.textContent = 'اتبعتلك إيميل تأكيد. اضغط الرابط اللي فيه وبعدها سجّل دخول. (ولو عايز تتخطاه: أوقّف Confirm email من إعدادات Supabase)'; return; }
    }
    const cl = await supabaseClient.rpc('claim_admin');
    if(cl.error || cl.data !== true){ try{ await supabaseClient.auth.signOut(); }catch(e){} err.textContent = 'فيه مسؤول موجود بالفعل. سجّل دخول بحسابه'; return; }
    adminSession = true; adminUnlocked = true;
    await afterAdminSignIn();
    await detectSecureMode();
    if(recSupported()){
      const a = await sbRpc('admin_issue_own_recovery');
      if(a.ok){ showRecoveryCode(a.code, () => renderAdmin()); return; }
    }
    renderAdmin();
    return;
  }
  const passwordHash = await sha256Hex(p);
  const code = genRecoveryCode();
  await saveAdminCreds({ username: u, passwordHash, recoveryHash: await sha256Hex(normCode(code)) });
  adminUnlocked = true;
  showRecoveryCode(code, () => renderAdmin());
}

function calcStats(attendance, studentId){
  let present=0, late=0, absent=0, excused=0;
  for(const date in attendance){
    const rec = attendance[date];
    const mark = rec ? normalizeMark(rec[studentId]) : undefined;
    if(!mark) continue;
    if(mark.status === 'present') present++;
    else if(mark.status === 'late') late++;
    else if(mark.status === 'absent') absent++;
    else if(mark.status === 'excused') excused++;
  }
  const countedDays = present + late + absent; // excused days don't count against the rate
  const attended = present + late;
  const total = present + late + absent + excused;
  return {
    total, present, late, absent, excused,
    pct: countedDays ? Math.round(attended/countedDays*100) : null
  };
}

// Counts how many of a student's most recent marked days were "absent",
// stopping at the first non-absent day. Used for the repeated-absence flag.
function currentAbsenceStreak(attendance, studentId){
  const dates = Object.keys(attendance).sort().reverse();
  let streak = 0;
  for(const date of dates){
    const mark = normalizeMark(attendance[date][studentId]);
    if(!mark) continue;
    if(mark.status === 'absent') streak++;
    else break;
  }
  return streak;
}

function escapeHtml(s){
  return (s||'').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}


function ensureServantFields(s){
  if(s.age === undefined) s.age = '';          // legacy, never shown: age is always computed from birthDate
  if(s.gender === undefined) s.gender = '';
  if(s.birthDate === undefined) s.birthDate = '';
  if(s.mobile === undefined) s.mobile = '';
  if(s.email === undefined) s.email = '';
  if(s.confessionFather === undefined) s.confessionFather = '';
  if(s.photo === undefined) s.photo = null;
  if(s.pastoralLog === undefined) s.pastoralLog = [];
  return s;
}

// Deterministic pastel-ish color from a name, so the same student always
// gets the same avatar background instead of everyone sharing the board color.
const AVATAR_PALETTE = ['#1F3358','#2E5E8C','#4C5E7A','#7A3E4C','#3F6B5E','#5B4C8A','#2E6B8F','#8A5A2E'];
function colorFromName(name){
  const s = (name||'؟');
  let hash = 0;
  for(let i=0;i<s.length;i++){ hash = (hash * 31 + s.charCodeAt(i)) >>> 0; }
  return AVATAR_PALETTE[hash % AVATAR_PALETTE.length];
}

function avatarHtml(student){
  const bg = colorFromName(student.name);
  if(student.photo){
    return `<div class="avatar" style="background:${bg};"><img src="${student.photo}" alt="" loading="lazy" data-i="${escapeHtml((student.name||'؟').trim().charAt(0))}" onerror="this.parentNode.textContent=this.dataset.i"></div>`;
  }

function resizeImageFile(file, maxSize=320, quality=0.72){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        let w = img.width, h = img.height;
        if(w > h){ if(w > maxSize){ h = Math.round(h * maxSize / w); w = maxSize; } }
        else { if(h > maxSize){ w = Math.round(w * maxSize / h); h = maxSize; } }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

async function saveClassEditor(classId){
  if(!requireAdmin()) return;
  const c = classes.find(x => x.id === classId); if(!c) return;
  normalizeClass(c);
  const err = document.getElementById('ce_err');
  const bad = m => { err.textContent = m; return false; };
  const name = document.getElementById('ce_name').value.trim().replace(/\s+/g, ' ');
  if(!name) return bad('اكتب اسم الفصل');
  if(classes.some(x => x.id !== classId && (x.className || '').trim().toLowerCase() === name.toLowerCase())) return bad('فيه فصل بنفس الاسم');
  const rows = [...document.querySelectorAll('#ce_servants .servant-row')];
  if(!rows.length) return bad('لازم يبقى فيه خادم واحد على الأقل');
  if(rows.length > 1 && secureMode && secureInfo && (secureInfo.version || 1) < 2) return bad('لتعدد الخدام شغّل ملف supabase-v2-classes.sql الأول');
  const newServants = [], seen = new Set();
  for(const r of rows){
    const sid = r.dataset.sid || '';
    const old = sid ? c.servants.find(s => s.id === sid) : null;
    const sName = r.querySelector('.sv-name').value.trim();
    const sUser = r.querySelector('.sv-user').value.trim();
    const sPass = r.querySelector('.sv-pass').value;
    if(!sName || !sUser) return bad('اكتب اسم الخادم واسم المستخدم لكل خادم');
    if(!old && !sPass) return bad('اكتب كلمة سر للخادم الجديد');
    if(sPass && sPass.length < 4) return bad('كلمة السر لازم تكون 4 حروف على الأقل');
    const key = sUser.toLowerCase();
    if(seen.has(key) || usernameInUse(sUser, old ? old.id : null)) return bad('اسم المستخدم "' + sUser + '" مستخدم قبل كده');
    seen.add(key);
    newServants.push({ id: old ? old.id : newServantId(), name:sName, username:sUser,
                       passwordHash: sPass ? await sha256Hex(sPass) : old.passwordHash });
  }
  const active = document.getElementById('ce_active').checked;
  if(!active && c.active !== false){
    if(!confirm('تعطيل الفصل؟ الخدام والمخدومين مش هيقدروا يدخلوا، وسجل الحضور هيفضل محفوظ.')) return;
  }
  c.className = name;                               // the class id never changes, so attendance / photos / profiles stay linked
  c.description = document.getElementById('ce_desc').value.trim();
  c.active = active;
  c.servants = newServants;
  mirrorLegacy(c);
  await saveClasses();
  document.getElementById('classEditor').remove();
  renderAdmin();
  issueServantCodes(true, null, true);
}

async function transferStudent(srcId, studentId, destId){
  if(!requireAdmin()) return false;
  const src = classes.find(x => x.id === srcId), dst = classes.find(x => x.id === destId);
  if(!src || !dst || src === dst || dst.active === false) return false;
  const s = src.students.find(x => x.id === studentId); if(!s) return false;
  if(dst.students.some(x => x.id === studentId)) return false;
  // attendance history moves with the child
  invalidateAttendanceCache(srcId); invalidateAttendanceCache(destId);
  const a1 = await loadAttendance(srcId), a2 = await loadAttendance(destId);
  let moved = false;
  for(const d of Object.keys(a1)){
    if(a1[d] && a1[d][studentId] !== undefined){
      a2[d] = a2[d] || {}; a2[d][studentId] = a1[d][studentId];
      delete a1[d][studentId]; moved = true;
    }
  }
  src.students = src.students.filter(x => x.id !== studentId);
  dst.students.push(s);
  if(moved){ await saveAttendance(srcId, a1); await saveAttendance(destId, a2); }
  await saveClasses();                       // also moves the photo entry (one photos map per class)
  invalidateAttendanceCache(srcId); invalidateAttendanceCache(destId);
  refreshStatsBlocks();
  if(document.getElementById('studentRows')) await renderStudentRows(srcId);
  return true;
}

/* ---------------- Import students from Excel / CSV ---------------- */
const IMPORT_HEADERS = {
  name:   ['الاسم','اسم','اسم المخدوم','الاسم بالكامل','name','full name','student','student name'],
  gender: ['النوع','الجنس','gender','sex'],
  mobile: ['الموبايل','موبايل','رقم الموبايل','التليفون','تليفون','رقم التليفون','الهاتف','رقم الهاتف','mobile','phone','tel','phone number','mobile number'],
  birthDate: ['تاريخ الميلاد','الميلاد','عيد الميلاد','birth date','birthdate','date of birth','dob','birthday'],
  email:  ['الإيميل','الايميل','البريد','البريد الإلكتروني','email','e-mail','mail'],
  confessionFather: ['أب الاعتراف','اب الاعتراف','father of confession','confession father','confessor']
};
function normHeader(h){ return String(h||'').trim().toLowerCase().replace(/[إأآ]/g,'ا').replace(/\s+/g,' '); }
function detectImportColumns(headerRow){
  const map = {};
  headerRow.forEach((h, i) => {
    const n = normHeader(h);
    for(const field in IMPORT_HEADERS){
      if(map[field] === undefined && IMPORT_HEADERS[field].some(a => normHeader(a) === n)) map[field] = i;
    }
  });
  return map;
}
function importIsoDate(v){
  if(v instanceof Date && !isNaN(v)){
    const p = n => String(n).padStart(2,'0');
    const d = new Date(v.getTime() + 12*3600*1000);          // cushion: SheetJS dates can be a few seconds / hours off midnight
    return d.getFullYear() + '-' + p(d.getMonth()+1) + '-' + p(d.getDate());
  }
  const s = String(v||'').trim().replace(/[٠-٩]/g, d => String(d.charCodeAt(0)-0x0660));
  if(!s) return '';
  let m = s.match(/^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})$/);
  if(m) return m[1] + '-' + m[2].padStart(2,'0') + '-' + m[3].padStart(2,'0');
  m = s.match(/^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{4})$/);            // day/month/year (Egypt)
  if(m) return m[3] + '-' + m[2].padStart(2,'0') + '-' + m[1].padStart(2,'0');
  return '';
}
function importMobile(v){
  let s = String(v==null?'':v).replace(/[٠-٩]/g, d => String(d.charCodeAt(0)-0x0660)).replace(/[^\d+]/g,'');
  if(/^1\d{9}$/.test(s)) s = '0' + s;                                  // Excel dropped the leading zero
  return s;
}
function importGender(v){
  const s = String(v == null ? '' : v).trim().toLowerCase().replace(/[إأآ]/g, 'ا');
  if(['ولد','ذكر','ابن','ولاد','male','m','boy'].includes(s)) return 'male';
  if(['بنت','انثي','انثى','أنثى','بنات','female','f','girl'].includes(s) || s === 'انثى') return 'female';
  return '';
}
function parseStudentRows(rows, existingNames){
  const out = { students:[], duplicates:0, empty:0, inFileDup:0 };
  if(!rows.length) return out;
  const first = rows[0];
  let cols = detectImportColumns(first), start = 1;
  if(cols.name === undefined){ cols = { name:0, mobile:1, birthDate:2, email:3, confessionFather:4 }; start = 0; }  // no header row
  const seen = new Set(existingNames.map(n => normHeader(n)));
  for(let r = start; r < rows.length; r++){
    const row = rows[r] || [];
    const name = String(row[cols.name] == null ? '' : row[cols.name]).trim().replace(/\s+/g,' ');
    if(!name){ if(row.some(x => String(x||'').trim())) out.empty++; continue; }
    const key = normHeader(name);
    if(seen.has(key)){ existingNames.some(n => normHeader(n) === key) ? out.duplicates++ : out.inFileDup++; continue; }
    seen.add(key);
    out.students.push({
      name,
      mobile: cols.mobile === undefined ? '' : importMobile(row[cols.mobile]),
      birthDate: cols.birthDate === undefined ? '' : (d => (d && !dobError(d) ? d : ''))(importIsoDate(row[cols.birthDate])),
      gender: cols.gender === undefined ? '' : importGender(row[cols.gender]),
      email: cols.email === undefined ? '' : String(row[cols.email]||'').trim(),
      confessionFather: cols.confessionFather === undefined ? '' : String(row[cols.confessionFather]||'').trim()
    });
  }
  return out;
}
async function importStudentsFile(event, classId){
  if(denyIfNotAllowed(classId)){ event.target.value=''; return; }
  const input = event.target, file = input.files[0];
  const note = document.getElementById('importNote');
  if(!file) return;
  const fail = m => { if(note){ note.textContent = m; note.style.color = 'var(--bad)'; } input.value=''; };
  if(!(await ensureXlsx())) return fail(XLSX_MISSING_MSG());
  if(file.size > 5*1024*1024) return fail('الملف كبير جدًا (أقصى حد 5 ميجا)');
  if(note){ note.style.color=''; note.textContent = 'جارِ قراءة الملف...'; }
  try{
    const buf = await file.arrayBuffer();
    const u8 = new Uint8Array(buf);
    let wb;
    if(/\.csv$/i.test(file.name) || file.type === 'text/csv'){
      let text;
      try{ text = new TextDecoder('utf-8', { fatal:true }).decode(u8); }
      catch(e){ text = new TextDecoder('windows-1256').decode(u8); }   // old Arabic Excel CSV
      wb = XLSX.read(text.replace(/^\uFEFF/, ''), { type:'string', cellDates:true });
    }else{
      const isZip = u8[0] === 0x50 && u8[1] === 0x4B, isOle = u8[0] === 0xD0 && u8[1] === 0xCF;
      if(!isZip && !isOle) throw new Error('not an excel file');
      wb = XLSX.read(buf, { type:'array', cellDates:true });
    }
    const ws = wb.Sheets[wb.SheetNames[0]];
    const rows = XLSX.utils.sheet_to_json(ws, { header:1, raw:true, defval:'' });
    const c = classes.find(x => x.id === classId);
    const parsed = parseStudentRows(rows, c.students.map(s => s.name));
    input.value = '';
    if(!parsed.students.length) return fail('مفيش مخدومين جداد في الملف (ممكن كلهم مكررين أو الملف فاضي)');
    if(parsed.students.length > 500) return fail('الملف فيه أكتر من 500 اسم. قسّمه على أكتر من ملف');
    showImportPreview(classId, parsed);
    if(note) note.textContent = '';
  }catch(e){
    console.error('import failed', e);
    fail('تعذر قراءة الملف. تأكد إنه ملف Excel أو CSV سليم');
  }
}

      ${parsed.duplicates ? `<div style="font-size:12px;color:#7B8194;">${parsed.duplicates} اسم موجود بالفعل في الفصل (هيتخطى)</div>` : ''}
      ${parsed.inFileDup ? `<div style="font-size:12px;color:#7B8194;">${parsed.inFileDup} اسم مكرر داخل الملف (هيتخطى)</div>` : ''}
      ${parsed.students.some(s => !s.gender) ? `<div style="font-size:12px;color:#7B8194;">${parsed.students.filter(s => !s.gender).length} بدون نوع (تقدر تحدده بعدين)</div>` : ''}
      ${parsed.students.some(s => !s.birthDate) ? `<div style="font-size:12px;color:#7B8194;">${parsed.students.filter(s => !s.birthDate).length} بدون تاريخ ميلاد صالح</div>` : ''}
      <div style="margin:10px 0;">${sample}${parsed.students.length > 6 ? `<div style="font-size:12px;color:#7B8194;padding-top:6px;">... و${parsed.students.length - 6} آخرين</div>` : ''}</div>
      <button class="btn btn-accent" style="width:100%;" id="importConfirmBtn">إضافة الكل</button>
      <button class="btn btn-line" style="width:100%;margin-top:10px;" onclick="this.closest('.modal-bg').remove()">إلغاء</button>
    </div>`;
  document.body.appendChild(bg);
  bg.querySelector('#importConfirmBtn').onclick = async () => {
    if(denyIfNotAllowed(classId)) return;
    const btn = bg.querySelector('#importConfirmBtn'); btn.disabled = true; btn.textContent = 'جارِ الإضافة...';
    const c = classes.find(x => x.id === classId);

    parsed.students.forEach((s, i) => c.students.push({ id:'s' + base + '_' + i, name:s.name, photo:null, gender:s.gender || '', birthDate:s.birthDate, mobile:s.mobile, email:s.email, confessionFather:s.confessionFather }));
    await saveClasses();
    bg.remove();
    await renderStudentRows(classId);
    const note = document.getElementById('importNote');
    if(note){ note.style.color = 'var(--good)'; note.textContent = 'تم إضافة ' + parsed.students.length + ' مخدوم ✓'; }
  };
