name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    # تثبيت Ubuntu 24.04 لتجنب مشاكل الانتقال المفاجئ إلى 26.04
    runs-on: ubuntu-24.04

    steps:
      # 1. تحديث checkout إلى الإصدار v6 (يدعم Node.js 24)
      - name: Checkout code
        uses: actions/checkout@v6

      # 2. تحديث setup-java إلى الإصدار v5
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      # 3. إعداد Android SDK (يبقى v4 فهو غير متأثر بالتحذيرات)
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      # 4. منح صلاحية التنفيذ لـ Gradle Wrapper
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 5. بناء ملف APK
      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace

      # 6. رفع ملف APK الناتج
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
