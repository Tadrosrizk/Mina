name: Android Build

# متى يتم تشغيل هذا الكود؟ (عند الدفع push أو عمل pull request على فرع main)
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. جلب الكود الخاص بك من المستودع
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. إعداد بيئة جافا (الإصدار 17 هو الأفضل لمعظم مشاريع أندرويد الحديثة)
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # 3. إعداد أندرويد SDK (مع تحديد الإصدار لتجنب توقف التراخيص)
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 11479570

      # 4. إعطاء صلاحية التشغيل لملف Gradle
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 5. بناء التطبيق (استخراج ملف APK لنسخة Debug)
      - name: Build with Gradle
        run: ./gradlew assembleDebug
