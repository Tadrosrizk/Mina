name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # إعداد Node.js (مهم جداً لمشاريع Capacitor عشان تثبت الحزم)
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      # تثبيت حزم النود (لأن مشروعك فيه package.json)
      - name: Install dependencies
        run: npm install

      # منح صلاحية التنفيذ لـ gradlew (الموجود جوه مجلد android)
      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      # بناء الـ APK من داخل مجلد android
      - name: Build Release APK
        run: cd android && ./gradlew assembleRelease --stacktrace

      # رفع الملف الناتج (لاحظ المسار بقى بيبدأ بـ android/)
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
