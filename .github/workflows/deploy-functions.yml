name: Deploy Supabase Functions

on:
  workflow_dispatch:

env:
  PROJECT_REF: tkoslrdahiedxjinwits

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Check and clean token
        env:
          RAW_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$RAW_TOKEN" ]; then
            echo "::error::The secret SUPABASE_ACCESS_TOKEN is EMPTY or missing. Add it in Settings > Secrets and variables > Actions (the name must be exactly SUPABASE_ACCESS_TOKEN)."; exit 1
          fi
          TOKEN=$(printf '%s' "$RAW_TOKEN" | tr -d '[:space:]"'"'")
          echo "Token length after cleaning: ${#TOKEN} (a real token is about 44 characters)"
          case "$TOKEN" in
            sbp_*) echo "Token format looks OK (starts with sbp_)";;
            sb_publishable_*|sb_secret_*) echo "::error::This is a project API key, not an Access Token. Make a new one at supabase.com/dashboard/account/tokens (it starts with sbp_)."; exit 1;;
            eyJ*) echo "::error::This looks like an old JWT API key (eyJ...), not an Access Token. Use a token from supabase.com/dashboard/account/tokens (starts with sbp_)."; exit 1;;
            *) echo "::error::The secret value does not start with sbp_. You probably pasted the wrong thing (the token NAME, a project key, or part of the text). Make a new token at supabase.com/dashboard/account/tokens and paste ONLY the token."; exit 1;;
          esac
          echo "SUPABASE_ACCESS_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      - name: Set AI key (only if you added the secret)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$ANTHROPIC_API_KEY" ]; then
            supabase secrets set ANTHROPIC_API_KEY="$ANTHROPIC_API_KEY" --project-ref "$PROJECT_REF"
          else
            echo "ANTHROPIC_API_KEY secret not set - skipping (the AI features will say 'not configured')"
          fi

      - name: Deploy friday-bc-pdf-questions
        run: supabase functions deploy friday-bc-pdf-questions --no-verify-jwt --project-ref "$PROJECT_REF"

      - name: Deploy friday-bc-generate-questions
        run: supabase functions deploy friday-bc-generate-questions --no-verify-jwt --project-ref "$PROJECT_REF"
