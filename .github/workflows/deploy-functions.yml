# نشر دوال المسابقة (توليد الأسئلة بالذكاء الاصطناعي) على Supabase من GitHub — يتشغّل بإيدك من الموبايل:
# GitHub ← Actions ← "Deploy Supabase Functions" ← Run workflow
name: Deploy Supabase Functions

on:
  workflow_dispatch:

env:
  PROJECT_REF: tkoslrdahiedxjinwits
  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Check token
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Add the SUPABASE_ACCESS_TOKEN secret first (Settings > Secrets and variables > Actions)"; exit 1
          fi

      - name: Set AI key (only if you added the secret)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$ANTHROPIC_API_KEY" ]; then
            supabase secrets set ANTHROPIC_API_KEY="$ANTHROPIC_API_KEY" --project-ref "$PROJECT_REF"
          else
            echo "ANTHROPIC_API_KEY secret not set - skipping (the AI features will say 'not configured')"
          fi

      - name: Deploy friday-bc-pdf-questions
        run: supabase functions deploy friday-bc-pdf-questions --no-verify-jwt --project-ref "$PROJECT_REF"

      - name: Deploy friday-bc-generate-questions
        run: supabase functions deploy friday-bc-generate-questions --no-verify-jwt --project-ref "$PROJECT_REF"
